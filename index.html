<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>아파트 매치 지도</title>

<!-- 🔎 검색엔진 소유확인·노출 (2026-08) — 이 파일이 아파트매치.com 의 첫 화면이라 여기에 둡니다 -->
<meta name="naver-site-verification" content="834ed7ce1c26f65e1d4202e5e4bc4fc85a5c14aa">
<link rel="canonical" href="https://아파트매치.com/">
<meta name="description" content="우리 아파트의 동급 단지는? 국토교통부 실거래가로 과거 같은 급이던 아파트들의 시세를 비교해 저평가된 곳을 찾아드립니다.">
<meta property="og:type" content="website">
<meta property="og:title" content="아파트 매치 — 우리 아파트 동급 찾기">
<meta property="og:description" content="동급 단지와 최근 실거래가 시세를 비교해 보세요. 아파트매치.">
<meta property="og:url" content="https://아파트매치.com/">
<meta name="robots" content="index, follow">

<!-- Leaflet (무료 지도 라이브러리) -->
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css">
<script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>

<style>
  :root{
    --ink:#1a1f26; --soft:#6B7684; --line:#E5E9EF; --bg:#F7F9FC;
    --hot:#E5484D; --warm:#F5A524; --cool:#3E9B4F; --accent:#C6A15B;
    --sib:#7048E8;   /* 동급 하이라이트 보라 */
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;font-family:-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;color:var(--ink)}
  #map{position:absolute;inset:0;top:94px;bottom:30px;transition:left .25s ease}
  /* [2026-08 · 검색·애드센스] 화면 맨 아래 얇은 띠.
     소개·개인정보처리방침·문의 페이지로 가는 길이 첫 화면에 없으면
     구글이 그 페이지들을 늦게 찾거나 못 찾습니다. 지도는 30px 위로 올려
     띠가 지도를 가리지 않게 했습니다. */
  .sitefootbar{position:absolute;left:0;right:0;bottom:0;height:30px;z-index:1200;
    display:flex;align-items:center;justify-content:center;gap:10px;
    background:#fff;border-top:1px solid rgba(0,0,0,.08);
    font-size:12px;color:#6B7076;padding:0 10px;box-sizing:border-box}
  .sitefootbar p{margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .sitefootbar a{color:#B4763A;text-decoration:none;white-space:nowrap}
  .sitefootbar a:hover{text-decoration:underline}
  .sitefootbar nav{white-space:nowrap}
  #returnChip{position:absolute;left:50%;transform:translateX(-50%);bottom:44px;z-index:1300;
    background:#fff;border:1.5px solid #B4763A;color:#B4763A;border-radius:999px;
    padding:9px 16px;font-size:13.5px;font-weight:700;font-family:inherit;
    box-shadow:0 4px 14px rgba(0,0,0,.18);cursor:pointer;white-space:nowrap}
  /* 링크 이름은 PC에선 길게(검색엔진이 무슨 페이지인지 알기 쉽게),
     폰에선 짧게. 긴 이름 그대로 두면 360px 폰에서 줄이 넘칩니다. */
  .sitefootbar .fs{display:none}
  /* [필터바 · 2026-08 카드형] 예전엔 한 줄 가로스크롤이라 오른쪽 필터가
     화면 밖으로 숨어 있는지도 몰랐습니다. 이제 차트의 검색 필터와 같은
     '접히는 카드'로 통일했습니다. 머리글만 42px 자리를 차지하고(지도 위치 그대로),
     펼치면 지도 위에 떠서 내려옵니다. 적용한 개수는 머리글에 숫자로 나옵니다. */
  .filterbar{position:absolute;top:52px;left:0;right:0;z-index:999;
    background:rgba(255,255,255,.96);backdrop-filter:blur(8px);
    border-bottom:1px solid rgba(0,0,0,.06);
    box-shadow:0 6px 16px rgba(0,0,0,.06)}
  /* [2026-08] 접기 기능 없앰 — 필터는 항상 보입니다.
     접혀 있으면 필터가 있는 줄도 모르고, 열고 닫는 손이 한 번 더 갑니다. */
  /* [2026-08 · 모바일] 필터가 화면 절반을 가려서 접기를 되살렸습니다.
     기본은 '접힘'이고, 머리글을 눌러야 펼쳐집니다.
     기본 필터(200세대·평당가 1000만)가 걸려 있으므로 자동으로 펼치지 않습니다
     — 자동으로 펼치면 접기를 만든 의미가 없어집니다. */
  .fbhead{display:flex;align-items:center;justify-content:space-between;
    height:42px;padding:0 14px;cursor:pointer;user-select:none;
    font-size:13px;font-weight:800;color:var(--ink)}
  .fbhead b{color:var(--accent);margin-left:6px;font-weight:800}
  .fbhead i{font-style:normal;color:#94A3B8;font-size:11px;transition:transform .15s}
  .filterbar.open .fbhead i{transform:rotate(180deg)}
  .fbbody{display:none;flex-wrap:wrap;gap:7px;padding:2px 12px 10px;align-items:flex-start}
  .filterbar.open .fbbody{display:flex}
  /* ── [범위 슬라이더] 검색 필터와 같은 부품. 손잡이 두 개로 정밀 조절 ── */
  .frng{flex:1 1 132px;min-width:126px;max-width:190px;border:1.5px solid var(--line);
    border-radius:10px;padding:4px 9px 6px;background:#fff}
  .frng.on{border-color:var(--accent);background:#F7F5FF}
  .frl{display:flex;align-items:center;justify-content:space-between;gap:4px;
    font-size:10.5px;color:#94A3B8;margin-bottom:1px;line-height:1.5}
  .frl b{font-size:11px;color:var(--ink);font-weight:800}
  .frng.on .frl b{color:var(--accent)}
  .frl i{font-style:normal;cursor:pointer;color:#B9BFC9;padding:0 2px;font-size:12px}
  .frng.on .frl i{color:var(--accent)}
  .frs{position:relative;height:18px}
  .frs .trk{position:absolute;top:8px;left:0;right:0;height:3px;border-radius:3px;background:#E3E6EB}
  .frs .trkOn{position:absolute;top:8px;height:3px;border-radius:3px;background:var(--accent)}
  /* 손잡이 2개를 겹쳐 놓고 막대는 투명하게 → '하나의 슬라이더'처럼 보입니다 */
  .frs input[type=range]{position:absolute;top:0;left:0;width:100%;height:18px;margin:0;
    -webkit-appearance:none;appearance:none;background:none;pointer-events:none}
  .frs input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;pointer-events:auto;
    width:15px;height:15px;border-radius:50%;background:#fff;border:2px solid var(--accent);
    box-shadow:0 1px 3px rgba(0,0,0,.22);cursor:pointer}
  .frs input[type=range]::-moz-range-thumb{pointer-events:auto;width:15px;height:15px;
    border-radius:50%;background:#fff;border:2px solid var(--accent);
    box-shadow:0 1px 3px rgba(0,0,0,.22);cursor:pointer}
  /* [2026-08] 드롭다운도 슬라이더처럼 '이름표 + 값' 카드 모양으로 */
  .fsel{flex:0 0 auto;border:1.5px solid var(--line);border-radius:10px;
    padding:4px 8px 5px;background:#fff}
  .fsel .frl{margin-bottom:0}
  .fsel select{border:0;background:none;padding:0;font-size:12.5px;font-weight:700;
    color:var(--ink);font-family:inherit;max-width:150px}
  .fsel:has(select.on){border-color:var(--accent);background:#F7F5FF}
  .fsel select.on{color:var(--accent)}
  .fbbody select{border:1.5px solid var(--line);border-radius:999px;
    padding:5px 10px;font-size:12.5px;font-family:inherit;background:#fff;
    color:var(--ink);font-weight:600;outline:none;flex:0 0 auto}
  .fbbody select:focus{border-color:var(--accent)}
  .fbbody select.on{border-color:var(--accent);color:var(--accent)}
  /* ── [B안 · 아실식 사이드 패널] ─────────────────
     핀 클릭 → 왼쪽에서 패널이 열리고 지도가 오른쪽으로 밀림.
     패널 안에는 기존 index.html 을 iframe(창문)으로 끼움 →
     차트·구시전국·거래이력 등 기존 기능이 100% 그대로 작동. */
  body.panel-open #map{left:var(--panelW,420px)}
  #panel{position:absolute;top:94px;bottom:30px;left:calc(-1*var(--panelW,420px) - 10px);width:var(--panelW,420px);z-index:900;
    background:#fff;border-right:1px solid rgba(0,0,0,.08);
    box-shadow:4px 0 20px rgba(0,0,0,.08);transition:left .25s ease, transform .25s ease;
    display:flex;flex-direction:column}
  body.panel-open #panel{left:0}
  #panel .phead{display:flex;align-items:center;gap:8px;padding:10px 12px;
    border-bottom:1px solid var(--line);flex:none}
  #panel .phead .pt{font-weight:800;font-size:14px;flex:1;white-space:nowrap;
    overflow:hidden;text-overflow:ellipsis}
  #panel .phead button{border:0;background:#F0F1F4;width:30px;height:30px;
    border-radius:8px;cursor:pointer;font-size:15px;flex:none}
  #panel iframe{flex:1;border:0;width:100%}
  /* [리사이즈] 패널 오른쪽 가장자리를 잡고 끌면 넓어짐 (요청: 차트 크게 보기) */
  #panelResize{position:absolute;top:0;right:-5px;width:10px;height:100%;
    cursor:ew-resize;z-index:950}
  #panelResize:hover{background:rgba(112,72,232,.15)}
  body.resizing{cursor:ew-resize;user-select:none}
  body.resizing #panel,body.resizing #map{transition:none}
  /* ══ [📍 지도 보기 · 차트 살짝 숨김(peek) · 2026-08] ═══════════════════════
     차트 안에서 📍를 누르면 모바일은 화면 전체가 차트라 지도를 볼 수 없었습니다.
     그래서 차트를 왼쪽으로 밀어 두고 오른쪽 가장자리 36px만 남깁니다(=손잡이).
     그 손잡이를 오른쪽으로 끌면(또는 톡 누르면) 차트가 다시 돌아옵니다.
     ※ 패널을 '닫는' 게 아니라 '밀어두는' 것이라 iframe 이 새로 안 읽혀 빠릅니다. */
  /* [손잡이 모양 · 2026-08 수정] 폭을 최소로 줄이고 베이지 톤 + 검은 글씨.
     (보라 카드는 너무 넓고 튀어서 지도 마커를 가렸습니다)                      */
  #peekGrip{display:none;position:absolute;left:0;top:50%;transform:translateY(-50%);
    width:22px;height:132px;
    z-index:960;align-items:center;justify-content:center;cursor:grab;
    background:#EFE3CC;border:1px solid #D8C6A4;border-left:0;
    color:#2B2118;font-weight:800;
    border-radius:0 10px 10px 0;box-shadow:2px 0 8px rgba(0,0,0,.16);
    touch-action:none;user-select:none;-webkit-user-select:none}
  #peekGrip span{writing-mode:vertical-rl;letter-spacing:2px;font-size:11px;line-height:1}
  /* 패널이 닫혀 있을 때만 보이는 '목록 ❯' 손잡이 (열려 있으면 숨김) */
  #panelTab{position:absolute;left:0;top:50%;transform:translateY(-50%);z-index:950;
    background:#fff;border:1px solid rgba(0,0,0,.14);border-left:0;
    border-radius:0 12px 12px 0;padding:16px 7px;cursor:pointer;
    box-shadow:2px 0 10px rgba(0,0,0,.14);display:flex;align-items:center}
  #panelTab span{writing-mode:vertical-rl;letter-spacing:2px;font-size:11.5px;
    font-weight:700;color:#5B6068;line-height:1}
  body.panel-open #panelTab{display:none}
  @media (max-width:760px){          /* 모바일: 패널이 화면 대부분 차지 */
    body.panel-open #map{left:0}
    .sitefootbar p{display:none}        /* 폰에서는 링크만 (한 줄에 안 들어감) */
    .sitefootbar .fl{display:none}
    .sitefootbar .fs{display:inline}
    .sitefootbar{font-size:12.5px;gap:0}
    #panel{width:100%;left:-100%}
    body.panel-open #panel{left:0}
    #panelResize{display:none}       /* 폭 조절 손잡이는 모바일에서 필요 없음(peek 손잡이와 겹침) */
    /* ── [겹침 버그 · 2026-08] ─────────────────────────────────────────────
       Leaflet 의 +/− 버튼과 아래쪽 출처 표기(© VWorld)는 z-index 1000 이고
       차트 패널은 900 입니다. 그래서 폰에서 패널이 화면을 덮어도 그 위로
       +/− 버튼이 뚫고 올라와 차트 글씨와 겹쳐 보였습니다.
       패널이 '펼쳐진' 동안만 지도 조작판을 감춥니다.
       (밀어둔 peek 상태에서는 지도를 보는 중이니 당연히 다시 보입니다)        */
    body.panel-open:not(.panel-peek) .leaflet-control-container{display:none}
    /* [peek] 왼쪽으로 밀어 36px만 남김. 드래그 중에는 JS 가 인라인 transform 으로 덮어씀 */
    body.panel-open.panel-peek #panel{transform:translateX(calc(-100% + 22px))}
    body.panel-open.panel-peek #peekGrip{display:flex}
  }

  .topbar{position:absolute;top:0;left:0;right:0;height:52px;z-index:1000;
    background:rgba(255,255,255,.88);backdrop-filter:blur(10px);
    border-bottom:1px solid rgba(0,0,0,.06);
    display:flex;align-items:center;gap:12px;padding:0 14px}
  .topbar .logo{font-weight:900;font-size:20px;letter-spacing:-0.5px;white-space:nowrap;color:var(--ink);
    text-decoration:none;cursor:pointer;
    /* [2026-08] 아래 `.topbar a` 규칙(테두리·배경·여백)이 로고에도 묻습니다.
       로고는 버튼이 아니라 글자여야 하므로 그 세 가지를 되돌립니다. */
    border:0;background:none;padding:0}
  .topbar .logo em{color:var(--accent);font-style:normal}
  .topbar .count{font-size:12px;color:var(--soft);margin-left:auto}
  .topbar a{font-size:12px;color:var(--soft);text-decoration:none;
    border:1px solid rgba(0,0,0,.08);background:rgba(255,255,255,.7);
    border-radius:8px;padding:6px 10px}
  /* [지도 종류 전환 버튼 · 2026-08] 오른쪽 위, 흰 알약 모양 */
  .map-mode-btn{background:#fff;border:1px solid rgba(0,0,0,.15);border-radius:8px;
    padding:6px 12px;font-size:13px;font-weight:800;color:#2B2118;cursor:pointer;
    box-shadow:0 1px 5px rgba(0,0,0,.2);line-height:1;white-space:nowrap}
  .map-mode-btn:hover{background:#F5EFE3}
  /* [검색] 지도 상단 검색창 — 치면 목록이 뜨고, 고르면 그 단지로 지도 이동 */
  .topbar .search{position:relative;flex:1;max-width:320px}
  .topbar .search input{width:100%;border:1.5px solid var(--line);border-radius:10px;
    padding:7px 12px;font-size:13px;font-family:inherit;outline:none;background:#fff}
  .topbar .search input:focus{border-color:var(--accent)}
  .sr-box{position:absolute;top:38px;left:0;right:0;background:#fff;
    border:1px solid var(--line);border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,.12);
    max-height:300px;overflow:auto;display:none;z-index:2000}
  .sr-box .sr{padding:9px 12px;font-size:13px;cursor:pointer;border-bottom:1px solid #F4F6F9}
  .sr-box .sr:hover{background:#F7F9FC}
  .sr-box .sr b{font-weight:700}
  .sr-box .sr span{color:var(--soft);font-size:11.5px;margin-left:6px}
  .sr-box .empty{padding:12px;font-size:12.5px;color:var(--soft)}

  .legend{position:absolute;bottom:20px;left:12px;z-index:1000;
    background:rgba(255,255,255,.92);backdrop-filter:blur(8px);
    border:1px solid rgba(0,0,0,.06);border-radius:12px;padding:10px 12px;font-size:12px;
    box-shadow:0 4px 20px rgba(0,0,0,.10)}
  .legend b{display:block;margin-bottom:6px}
  .legend .row{display:flex;align-items:center;gap:6px;margin:3px 0;color:var(--soft)}
  .legend .dot{width:12px;height:12px;border-radius:50%;flex:none}
  .legend .dot.sq{border-radius:3px;background:var(--sib)}
  /* [2026-08] 차트 패널이 열리면 지도 범례를 숨김 (차트 위에 겹치지 않게) */
  body.panel-open .legend{display:none}

  /* ── 말풍선 핀 v3 · 아실식 시인성 ─────────────
     [2026-08] 글자가 작고 어둡다는 피드백 반영:
     · 이름: 13px 흰 배경 + 진한 남색 글씨 (아실의 흰바탕 파란글씨처럼 대비↑)
     · 가격: 12px, 색 배지는 유지하되 더 크게
     · 흰 테두리 + 진한 그림자로 지도 위에서 또렷하게 */
  .tag{position:relative;transform:translate(-50%,-100%);cursor:pointer;
    filter:drop-shadow(0 2px 5px rgba(0,0,0,.35))}
  .tag .nm{background:#fff;color:#1B3A6B;font-size:13px;font-weight:800;
    padding:3.5px 10px;border-radius:8px 8px 0 0;white-space:nowrap;text-align:center;
    letter-spacing:-0.3px;border:1.5px solid #1B3A6B;border-bottom:0}
  .tag .pr{color:#fff;font-size:12px;font-weight:800;padding:3px 10px;
    border-radius:0 0 8px 8px;white-space:nowrap;text-align:center;
    letter-spacing:-0.2px;border:1.5px solid rgba(0,0,0,.12);border-top:0}
  .tag::after{content:"";display:block;width:0;height:0;margin:0 auto;
    border:5px solid transparent;border-top-color:#1B3A6B}
  .tag.sel .nm{background:var(--sib);color:#fff;border-color:var(--sib)}
  .tag.sel::after{border-top-color:var(--sib)}
  .tag.sib-hl .nm{background:var(--sib);color:#fff;border-color:var(--sib)}
  .tag.sib-hl::after{border-top-color:var(--sib)}
  .tag:hover{filter:drop-shadow(0 4px 10px rgba(0,0,0,.45))}
  /* [대장 아파트 · 2026-08] 왕관 2종 —
     king-gu(우리 시 대장)=금색 / king-nat(전국 대장)=보라색. 기준은 최근 거래가 중앙값 */
  .tag.king-gu .nm{border-color:#E0A400;color:#8A5A00;
    background:linear-gradient(#FFF9E8,#FFF)}
  .tag.king-gu::after{border-top-color:#E0A400}
  .tag.king-gu{filter:drop-shadow(0 2px 6px rgba(224,164,0,.55))}
  .tag.king-nat .nm{border-color:#7048E8;color:#4326A8;
    background:linear-gradient(#F3EEFF,#FFF)}
  .tag.king-nat::after{border-top-color:#7048E8}

<script>
/* [모바일 첫화면 · 2026-08] 폰(<760px)으로 그냥 접속하면 차트 홈이 먼저 뜨게.

   PC 는 지도가 그대로 첫 화면. */
if(window.innerWidth<760 && location.search.indexOf('m=1')<0){
  location.replace('./chart.html');
}
/* [2026-08] rate 음수 = 동급보다 비싸다(고평가). 예전엔 음수도 초록으로 나와서
   '10% 미만 저평가'와 구별이 안 됐습니다. 고평가는 회색빛 파랑으로 분리합니다. */
/* [색 구분 · 2026-08] 고평가를 회색(#64748B)으로 뒀더니
   '동급 없는 단지'의 연회색(#94A3B8)과 거의 같아 보여 구별이 안 됐습니다.
   고평가는 파랑으로 바꿉니다 — 빨강(저평가 큼)의 반대편 느낌이라 뜻도 맞습니다. */
function rateColor(r){ if(r<0)return'#2B6CB0'; if(r>=20)return'#E5484D'; if(r>=10)return'#F5A524'; return'#3E9B4F'; }
function fmtEok(man){ if(!man)return'-'; return (man/10000).toFixed(1)+'억'; }

let map, layerTags, layerDots, selCircle=null, selKey=null;
/* [필터 · 2026-08] 저평가율·평형·세대수 조건. 바꾸면 핀이 즉시 걸러짐 */
const NOW_YEAR = new Date().getFullYear();
/* ══ [지도 필터 기본값 · 2026-08] ═══════════════════════════════════════════
   요청: 지도를 처음 열었을 때 '200세대 이상 · 평당가 1000만 이상'이 기본으로
        걸려 있어야 함(나홀로·초저가 단지가 지도를 덮는 것을 막음).
        슬라이더를 양 끝까지 벌리면 언제든 전체로 되돌릴 수 있습니다.
   중요: 세대수는 '미상(0)'도 함께 통과시킵니다.
        신축은 세대수 정보가 늦게 들어와서(예: 레이카운티(2단지)),
        200세대 조건을 엄격히 걸면 새 아파트가 지도에서 통째로 사라집니다. */
const FILTER = { rate:null, py:null, hh:[200, Infinity], by:null,
                 now:null, pp:[1000, Infinity], king:'' };
function passFilter(b){
  if(!b) return false;
  // [대장 필터] any=대장 아무거나 · nat=전국 대장만 · gu=우리 시 대장만
  if(FILTER.king){
    if(FILTER.king==='any' && !b.king) return false;
    if(FILTER.king==='nat' && b.king!=='nat') return false;
    if(FILTER.king==='gu'  && b.king!=='gu')  return false;
  }
  // 저평가율 구간 필터가 켜져 있으면, 저평가 아닌 단지(plain)는 제외 + 구간 밖도 제외
  if(FILTER.rate){
    if(b.plain) return false;
    const r = b.rate||0;
    if(r<FILTER.rate[0] || r>=FILTER.rate[1]) return false;
  }
  if(FILTER.hh){
    /* [2026-08] 세대수 미상(0)은 통과시킵니다.
       신축은 세대수가 늦게 들어와서, 엄격히 걸면 새 아파트가 다 사라집니다. */
    const hh=b.hh||0;
    if(hh && (hh<FILTER.hh[0] || hh>FILTER.hh[1])) return false;
  }
  /* ══ [평형·가격·평당가 필터 · 2026-08 개편] ═════════════════════════════════
     예전엔 '대표 평형 하나'만 봤습니다. 그래서 동래SKVIEW(대표 50평 8.5억)는
     "30평대 · 6억대"로 걸러도 안 잡혔습니다 — 34평 6억대가 실제로 있는데도요.
     지금은 pyList(그 아파트의 모든 평형)를 보고 **하나라도 맞으면 통과**합니다.
     · 평형과 가격을 함께 걸면 '같은 평형에서 둘 다 맞는지'를 봅니다
       (34평이 6억, 50평이 8.5억일 때 "30평대+6억대"는 통과, "30평대+8억대"는 탈락) */
  const _pl = (b.pyList && b.pyList.length) ? b.pyList
            : [{py:b.pyeong, now:b.now||0, pp:b.pp||0}];
  if(FILTER.py || FILTER.now || FILTER.pp){
    const ok = _pl.some(u=>{
      if(FILTER.py && !(u.py>=FILTER.py[0] && u.py<=FILTER.py[1])) return false;
      if(FILTER.now && !(u.now && u.now>=FILTER.now[0] && u.now<=FILTER.now[1])) return false;
      if(FILTER.pp){
        const pp = u.pp || (u.now&&u.py ? Math.round(u.now/u.py) : 0);
        if(!pp || pp<FILTER.pp[0] || pp>FILTER.pp[1]) return false;
      }
      return true;
    });
    if(!ok) return false;
  }
  // 입주년차 = 올해 - 건축년도 (by 0이면 미상 → 필터 켜면 제외)
  if(FILTER.by){
    const age = b.by ? (NOW_YEAR - b.by) : -1;
    if(age<0 || age<FILTER.by[0] || age>FILTER.by[1]) return false;
  }
  // (현재가·평당가는 위 pyList 블록에서 평형과 함께 판정합니다)
  // 평당가(만원)
  return true;
}
/* [카드형 · 2026-08] 머리글에 '몇 개 적용'을 표시하고, 켜진 필터에 색 테두리.
   카드가 닫혀 있어도 필터가 걸려 있는지 알 수 있어야 합니다. */
function markFilterCount(){
  const bar=document.getElementById('filterbar'); if(!bar) return;
  const sels=bar.querySelectorAll('.fbbody select');
  let n=0;
  sels.forEach(s=>{ if(s.value){ s.classList.add('on'); n++; } else s.classList.remove('on'); });
  // 슬라이더(.frng.on)도 함께 셉니다 — 접혀 있어도 몇 개 걸렸는지 알아야 하니까요
  n += bar.querySelectorAll('.fbbody .frng.on').length;
  const lab=document.getElementById('fbCount');
  if(lab) lab.textContent = n ? ' ' + n + '개 적용' : '';
}
function applyFilter(){
  markFilterCount();
  layerDots.clearLayers();
  let n=0;
  for(const key in MARKERS){
    if(passFilter(BEST[key])){ layerDots.addLayer(MARKERS[key].dot); n++; }
  }
  refreshTags(); syncLayers();
  document.getElementById('count').textContent = `표시 ${n}곳`;
}
let BEST={}, MARKERS={}, COORDS_G={};          // key → 후보정보 / key → {tag, dot}
const ZOOM_TAG = 14;              // 이 배율 이상이면 이름 말풍선, 미만이면 점

/* ══ [Cloudflare R2 이전 · 2026-08-18] 데이터를 어디서 받을지 ═══════════════
   무거운 데이터(data.js · coords.json · all_list.js)를 GitHub 대신
   Cloudflare R2 에서 받아옵니다.
   · 주소는 반드시 / 로 끝나야 합니다.
   · 예전처럼 같은 폴더에서 받으려면  './'  로 바꾸세요. */
const DATA_BASE = 'https://pub-9d32708861394fa2baa26dda30ed2eb3.r2.dev/';

async function boot(){
  await new Promise((ok,err)=>{ const s=document.createElement('script');
    s.src=DATA_BASE+'data.js'; s.onload=ok; s.onerror=()=>err(); document.head.appendChild(s); });
  const DATA = window.__APTDATA__;
  if(!DATA){ fail('data.js 에 데이터가 없어요'); return; }

  let COORDS;
  try{ COORDS = await (await fetch(DATA_BASE+'coords.json')).json(); window.COORDS_G = COORDS; }
  catch(e){ fail('coords.json 못 읽음 — http 서버로 열어주세요'); return; }
  COORDS_G = COORDS;      // [검색용] 전역 보관

  /* ══ [전체 표시 · 2026-08 B단계] all_list.js 불러와 아파트 단위로 묶기 ═════
     왜: data.js 에는 '평당가 밴드 안 + 최근 거래 있는' 단지만 들어갑니다.
         그래서 44평 단지가 지도·검색에 아예 없었습니다.
     한 줄 = [아파트명, 평형, 현재가, 세대수, 건축년도, 마지막거래가, 마지막거래월]
     금액은 '억×10'(65 = 6.5억) → 화면용 만원으로 바꿀 때 ×1000.
     현재가가 0이면 최근 6개월 거래가 없는 단지 → 마지막 거래가를 대신 씁니다.
     파일이 없어도 지도는 예전처럼 돌아갑니다(있으면 전체가 나옵니다). */
  window.ALLAPT = {};
  await new Promise(ok=>{ const s2=document.createElement('script');
    s2.src=DATA_BASE+'all_list.js'; s2.onload=ok; s2.onerror=ok;
    document.head.appendChild(s2); });
  (function(){
    const AL=(window.__ALLLIST__||{}).r||{};
    for(const rc in AL){
      const rn=AL[rc].n||'';
      for(const u of (AL[rc].u||[])){
        const nm=u[0], py=u[1], nowV=u[2]||0, hh=u[3]||0, by=u[4]||0,
              lastV=u[5]||0, lastM=u[6]||'',
              dong=u[7]||'';        // [2026-08] 법정동 — "우동 롯데" 검색·표시용
        const id=rc+'|'+nm;
        let a=ALLAPT[id];
        if(!a) a=ALLAPT[id]={name:nm, rc:rc, rname:rn, pys:[], byPy:{},
                             now:0, lastV:0, lastM:'', hh:hh, by:by, dong:dong};
        if(py && a.pys.indexOf(py)<0) a.pys.push(py);
        /* [2026-08] 평형별 가격을 반드시 남깁니다.
           예전엔 `if(nowV>a.now) a.now=nowV` 로 **가장 비싼 평형 하나만** 남겼습니다.
           그래서 동래SKVIEW 34평 6억대가 사라지고 50평 8.5억만 남아,
           지도 마커도 8.5억으로 찍히고 "30평대+6억대" 필터에도 안 잡혔습니다. */
        if(py) a.byPy[py] = Math.max(a.byPy[py]||0, nowV || lastV || 0);
        if(nowV>a.now) a.now=nowV;              // (전체 대표값 — 폴백용으로만 유지)
        if(lastM>a.lastM){ a.lastM=lastM; a.lastV=lastV; }
      }
    }
    for(const id in ALLAPT) ALLAPT[id].pys.sort((x,y)=>x-y);
    console.log('[all_list] 아파트', Object.keys(ALLAPT).length);
  })();

  /* ══ [대표 평형·기준 개편 · 2026-08] ══════════════════════════════════════
     예전 문제 두 가지:
      ① 대표 평형을 '저평가율이 가장 큰 평형'으로 골랐습니다.
         → 동래SKVIEW 가 50평 8.5억으로 지도에 찍혔습니다. 사람들은 그 단지를
           30평대 6억대로 아는데, 지도만 보면 "8.5억?" 하고 오해합니다.
      ② 저평가율을 '구(區) 동급' 기준(rate)으로 썼습니다.
         → 차트는 '시 동급'(siRate)으로 그리는데 마커는 구 기준이라 숫자가 달랐습니다.
           (코오롱하늘채1차: 마커 +6% vs 차트 +21%)
     지금:
      ① 대표 = **33평에 가장 가까운 평형** (사람들이 그 아파트 가격으로 떠올리는 값)
      ② 저평가율 = **시 동급 기준(siRate)** 우선, 없으면 구 기준(rate)
      ③ 그 아파트의 모든 평형 정보를 pyList 에 담아둡니다 → 필터가 '어느 평형이라도
         조건에 맞으면 통과'하도록. (예전엔 대표 평형 하나만 봐서, 30평대·6억으로
         걸러도 동래SKVIEW 가 안 잡혔습니다 — 필터가 사실상 무의미했습니다)     */
  const _PY_IDEAL = 33;                 // 30평대 대표. 사람들이 가장 먼저 떠올리는 크기
  for(const reg of DATA.regions||[]){
    for(const c of reg.candidates||[]){
      const key = reg.code + '|' + c.name;
      const _rate = (c.siRate != null) ? c.siRate : (c.rate || 0);
      const prev = BEST[key];
      if(prev){
        // 이미 있으면 '평형 목록'만 늘리고, 대표는 33평에 더 가까운 쪽으로 교체
        prev.pyList.push({py:c.pyeong, now:c.now||0, pp:c.pp||0, rate:_rate});
        if(Math.abs(c.pyeong - _PY_IDEAL) < Math.abs(prev.pyeong - _PY_IDEAL)){
          Object.assign(prev, { rate:_rate, pyeong:c.pyeong, now:c.now||0,
                                sibMed:c.sibMed||0, sibMax:c.sibMax||0,
                                sibs:c.sibs||[], pp:c.pp||0 });
        }
        continue;
      }
      BEST[key] = { key, name:c.name, rname:reg.name, rate:_rate,
                    pyeong:c.pyeong, now:c.now||0, sibMed:c.sibMed||0,
                    sibMax:c.sibMax||0,
                    king:null, kingN:0, kingPy:0,
                    sibs:c.sibs||[], regionCode:reg.code, hh:c.hh||0,
                    pp:c.pp||0, by:c.by||0,
                    pyList:[{py:c.pyeong, now:c.now||0, pp:c.pp||0, rate:_rate}] };
    }
  }

  /* [대장 아파트 · 2026-08 개편] 왕관 2종 — 판정은 build_all.py 가 미리 계산.
     · 기준값: 최근 거래가 중앙값(총액). 증여 등 급락 거래는 걸러낸 값입니다.
       (평당가로 해보니 동급은 총액이 이미 비슷해서 평형 작은 쪽이 무조건 이겼습니다)
     · king='nat' (보라) : 전국 동급 무리 중 실거래가 1위
     · king='si'  (금)   : 같은 시(광역시는 시 전체) 동급 중 1위, 전국 1위는 아님
     · 동급 아파트 2곳 이상일 때만 왕관 (같은 아파트 다른 평형은 1곳으로 셈)
     여기서는 '같은 아파트의 여러 평형 중 가장 센 왕관'을 대표로 올려줍니다.
     (BEST 는 저평가율이 큰 평형 하나만 남기므로, 대장인 평형이 다를 수 있습니다) */
  for(const reg of DATA.regions||[]){
    for(const c of reg.candidates||[]){
      if(!c.king) continue;
      const b = BEST[reg.code + '|' + c.name];
      if(!b || b.plain) continue;
      // 내부 표기는 기존 그대로 씁니다(CSS·필터 호환): nat=보라 · gu=금(시 대장)
      // kingPy = 왕관이 나온 평형. 말풍선에 보여줘야 헷갈리지 않습니다
      //   (BEST 대표 평형과 대장 평형이 다를 수 있습니다)
      /* kingMo/kingLen/kingRun = 최근 N개월 중 1위였던 달 · 판정 가능한 달 · 최근 연속 */
      if(c.king==='nat'){ b.king='nat'; b.kingN=c.kingN||0; b.kingPy=c.pyeong;
                          b.kingMo=c.kingMo||0; b.kingLen=c.kingLen||0; b.kingRun=c.kingRun||0; }
      else if(b.king!=='nat'){ b.king='gu'; b.kingN=c.kingN||0; b.kingPy=c.pyeong;
                          b.kingMo=c.kingMo||0; b.kingLen=c.kingLen||0; b.kingRun=c.kingRun||0; }
    }
  }

  map = L.map('map',{zoomControl:true}).setView([35.18,129.08],12);  // 부산 시작
  /* [스타일 v3] 배경 지도를 VWorld(국토부) 타일로.
     · 한국 학교·상가·역·등산로가 네이버 수준으로 표시됨 (Voyager는 서양용이라 텅 비었음)
     · 아래 VWORLD_KEY 에 발급받은 키를 넣어야 합니다 (collect_coords.py 와 같은 키) */
  const VWORLD_KEY = "D5FA780D-E92F-3BB0-BBA2-7DD5F5FBECF7";   // ← 여기에 VWorld 키 입력!
  /* ══ [지도 종류 · 2026-08] 일반 ↔ 위성 전환 ═══════════════════════════════════
     왜 넣나: 국토부 일반지도(Base)는 재개발 완공 반영이 느립니다(예: 거제동
     레이카운티가 아직 "재개발 신축공사"로 표시). 위성(항공)영상은 실제로 찍은
     사진이라 완공된 건물이 그대로 보입니다. 네이버의 '일반/위성'과 같은 개념.
       · 일반  = Base (도로·지명·상가까지 깔끔)
       · 위성  = Satellite(항공사진) + Hybrid(그 위에 도로·지명 글씨만 겹침)
                위성만 켜면 글자가 하나도 없어 어디가 어딘지 모르므로 Hybrid 필수. */
  let _baseLayer=null, _satLayer=null, _hybLayer=null, _mapMode="normal";
  if(VWORLD_KEY){
    _baseLayer = L.tileLayer(`https://api.vworld.kr/req/wmts/1.0.0/${VWORLD_KEY}/Base/{z}/{y}/{x}.png`,
      {maxZoom:19, attribution:'© VWorld 국토교통부'});
    _satLayer = L.tileLayer(`https://api.vworld.kr/req/wmts/1.0.0/${VWORLD_KEY}/Satellite/{z}/{y}/{x}.jpeg`,
      {maxZoom:19, attribution:'© VWorld 국토교통부'});
    _hybLayer = L.tileLayer(`https://api.vworld.kr/req/wmts/1.0.0/${VWORLD_KEY}/Hybrid/{z}/{y}/{x}.png`,
      {maxZoom:19});                          // 위성 위에 얹는 '지명·도로' 글씨 레이어
    _baseLayer.addTo(map);                    // 처음엔 일반지도
  }else{
    // 키 없으면 임시로 Voyager (한국 상세표시 없음)
    _baseLayer = L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png',
      {maxZoom:19, subdomains:'abcd', attribution:'© OpenStreetMap © CARTO'}).addTo(map);
  }
  /* 전환 함수: 버튼을 누르면 일반↔위성을 오갑니다. 마커·클러스터는 별도 레이어라
     배경만 갈아끼워도 핀은 그대로 남습니다. */
  function setMapMode(mode){
    if(!_satLayer) return;                     // 위성 레이어가 없으면(키 없음) 무시
    if(mode==="satellite"){
      map.removeLayer(_baseLayer);
      _satLayer.addTo(map); _hybLayer.addTo(map);
      _satLayer.bringToBack();                 // 사진을 맨 아래, 그 위에 글씨(Hybrid)
      _mapMode="satellite";
    }else{
      map.removeLayer(_satLayer); map.removeLayer(_hybLayer);
      _baseLayer.addTo(map); _baseLayer.bringToBack();
      _mapMode="normal";
    }
    const btn=document.getElementById("mapModeBtn");
    if(btn) btn.textContent = (_mapMode==="satellite") ? "🗺️ 일반" : "🛰️ 위성";
  }
  /* 지도 위 오른쪽 위에 작은 전환 버튼 하나 추가 (Leaflet 컨트롤로) */
  if(_satLayer){
    const Ctl = L.Control.extend({
      options:{position:"topright"},
      onAdd:function(){
        const b=L.DomUtil.create("button","map-mode-btn");
        b.id="mapModeBtn"; b.type="button"; b.textContent="🛰️ 위성";
        b.title="일반지도 ↔ 위성지도 전환";
        L.DomEvent.disableClickPropagation(b);   // 버튼 눌러도 지도 안 움직이게
        L.DomEvent.on(b,"click",()=> setMapMode(_mapMode==="satellite"?"normal":"satellite"));
        return b;
      }
    });
    map.addControl(new Ctl());
  }

  layerTags = L.layerGroup();      // 이름 말풍선 (확대 시)
  layerDots = L.markerClusterGroup({maxClusterRadius:45, chunkedLoading:true}); // 점 (축소 시)

  /* [2단계 준비 · 2026-08] 전체 단지 표시 스위치.
     · false = 저평가 후보만 (지금, 전체 좌표 수집 전)
     · true  = 모든 단지 (collect_coords_all.py 로 전체 좌표 수집 후 켜기)
     저평가 아닌 단지는 회색(#94A3B8) 핀으로 구분됩니다. */
  const SHOW_ALL = true;

  /* 후보가 아닌 단지도 BEST 에 넣어두기(회색). 좌표 있는 것만.
     [B단계] 예전엔 peerdata.units(밴드 안 5,500개)만 봐서 44평 단지가 없었습니다.
     이제 all_list.js(전체 96,726 단위 = 아파트 35,111개)를 씁니다.
     all_list.js 가 없으면 예전 방식(peerdata.units)으로 자동 폴백합니다. */
  if(SHOW_ALL){
    const useAll = Object.keys(ALLAPT).length > 0;
    if(useAll){
      for(const key in ALLAPT){
        const a=ALLAPT[key];
        if(BEST[key]){
          /* [2026-08] 이미 후보인 단지도 **전체 평형을 합쳐** 줍니다.
             예전엔 continue 로 건너뛰어서, 후보에 없는 평형(자격 미달 34평 등)이
             pyList 에 빠졌습니다. 동래SKVIEW 가 50평만 남은 원인입니다. */
          const B=BEST[key];
          B.pyList = B.pyList || [];
          const have = new Set(B.pyList.map(x=>x.py));
          for(const _p of a.pys){
            if(have.has(_p)) continue;
            const _v=(a.byPy[_p]||0)*1000;    // 억×10 → 만원
            B.pyList.push({py:_p, now:_v, pp:0, rate:null});
          }
          // 대표 평형을 전체 평형 중 33평에 가장 가까운 것으로 다시 고름
          let best=B.pyList[0];
          for(const u of B.pyList)
            if(Math.abs(u.py-_PY_IDEAL) < Math.abs(best.py-_PY_IDEAL)) best=u;
          if(best && best.py!==B.pyeong){
            B.pyeong=best.py;
            if(best.now) B.now=best.now;
            if(best.rate!=null) B.rate=best.rate;
            else { B.rate=null; B.sibMed=0; B.sibs=[]; }   // 후보 아닌 평형이 대표면 저평가율 없음
          }
          continue;
        }
        if(!COORDS[key]) continue;            // 좌표 없으면 못 찍음
        /* [2026-08] 예전엔 pys 의 '마지막(가장 큰) 평형'을 대표로 써서
           대형 평형 가격이 지도에 찍혔습니다. 후보와 같은 규칙(33평에 가까운 것)으로. */
        let _rep = a.pys[0]||0;
        for(const _p of a.pys)
          if(Math.abs(_p-_PY_IDEAL) < Math.abs(_rep-_PY_IDEAL)) _rep=_p;
        // 대표 평형의 '그 평형 가격'을 씁니다(전체 최고가가 아님)
        const _nowW = ((a.byPy[_rep]||a.now||a.lastV)||0)*1000;   // 억×10 → 만원
        BEST[key] = { key, name:a.name, rname:a.rname, rate:null,
                      pyeong:_rep,
                      now:_nowW,
                      sibMed:0, sibs:[], regionCode:a.rc,
                      hh:a.hh, pp:0, by:a.by, plain:true,
                      pys:a.pys, lastM:a.lastM, noRecent:!a.now,
                      pyList:a.pys.map(_p=>({py:_p,
                        now:((a.byPy[_p]||0)||0)*1000, pp:0, rate:null})) };
      }
    } else {
      const PD = (window.__APTDATA__||{}).peerdata||{};
      const units = PD.units||{}, rmap = PD.rmap||{};
      for(const uk in units){
        const u = units[uk];
        const key = u.rc + '|' + u.name;
        if(BEST[key] || !COORDS[key]) continue;
        BEST[key] = { key, name:u.name, rname:rmap[u.rc]||u.rn||'', rate:null,
                      pyeong:u.pyeong, now:0, sibMed:0, sibs:[], regionCode:u.rc,
                      hh:u.hh||0, pp:0, by:u.by||0, plain:true };
      }
    }
  }

  /* ══ [마커 겹침 풀기 · 2026-08] ═══════════════════════════════════════════
     한 아파트의 여러 단지가 '대표지번' 하나를 공유해서 좌표가 완전히 같습니다.
     (엘지메트로시티1·3·4·5 / DMC파크뷰자이1~4 / 레이카운티1~4 … 전국 34곳)
     그대로 두면 마커가 하나만 보이고 나머지는 그 아래 완전히 가려집니다.
     좌표를 고치는 건 불가능합니다 — 국토부 지번이 실제로 같으니까요.
     그래서 같은 자리에 여럿이면 아주 작은 원(약 13m)으로 흩뿌립니다.
     · 13m 는 아파트 한 동 폭보다 작아서 '위치가 틀렸다'고 느껴지지 않습니다
     · 경도는 위도에 따라 실제 거리가 달라지므로 cos(위도)로 보정합니다
     · 원본 좌표는 COORDS 에 그대로 두고, 화면 표시용으로만 옮깁니다        */
  const _samePos = {};
  for(const key in BEST){
    const c = COORDS[key];
    if(!c || !c.lat) continue;
    const p = c.lat.toFixed(5) + ',' + c.lon.toFixed(5);
    (_samePos[p] = _samePos[p] || []).push(key);
  }
  const JIT = {};
  let _jitGroups = 0;
  for(const p in _samePos){
    const ks = _samePos[p];
    if(ks.length < 2) continue;
    _jitGroups++;
    const R = 0.00012;                       // 위도 0.00012° ≒ 13m
    const latRad = parseFloat(p.split(',')[0]) * Math.PI / 180;
    const cosLat = Math.max(0.3, Math.cos(latRad));
    ks.forEach((k, i) => {
      const a = 2 * Math.PI * i / ks.length;
      JIT[k] = [R * Math.cos(a), R * Math.sin(a) / cosLat];
    });
  }
  if(_jitGroups) console.log('[마커겹침] 같은 좌표 지점', _jitGroups, '곳 흩뿌림');

  let placed=0;
  for(const key in BEST){
    const b=BEST[key], co=COORDS[key];
    if(!co) continue;
    const _j = JIT[key];
    b.lat = co.lat + (_j ? _j[0] : 0);
    b.lon = co.lon + (_j ? _j[1] : 0);
    // [색] 저평가 후보=율에 따른 색 / 비후보(plain)=회색
    const color = b.plain ? '#94A3B8' : rateColor(b.rate);
    // 음수는 '동급보다 비쌈'. 부호만으론 헷갈리므로 색(회색빛)과 함께 읽힙니다.
    const label = b.plain ? fmtEok(b.now)
                          : (b.rate>=0?'+':'\u2212')+Math.abs(b.rate).toFixed(0)+'%';

    // (A) 아실식 말풍선: 이름 + 현재가·저평가율 (대장이면 👑)
    /* [2026-08] 왕관은 '평형별'로 붙는데 마커는 아파트 하나입니다.
       그래서 어느 평형이 대장인지 왕관 옆에 적어줍니다.
       (예: 24평 차트를 보는데 왕관은 31평 것이면 아무도 이해 못 합니다) */
    const kpy = b.kingPy ? b.kingPy+'평' : '';
    const _kg = kingGrade(b);
    const _kt = _kg ? ` · ${_kg.name}(${_kg.desc})` : '';
    /* [2026-08] 등급을 마커에 바로 보여줍니다.
       예전엔 말풍선에만 넣었는데, 마커를 누르면 select() 가 사이드 패널을
       곧바로 열어서 말풍선이 뜰 틈이 없었습니다(등급을 아무도 볼 수 없었음).
         부동의 대장 → 👑★  ·  신흥 대장 → 👑NEW  ·  그냥 대장 → 👑
       자세한 내용(몇 달 중 몇 달 1위)은 마커에 손을 올리면 나옵니다. */
    const _kmark = !_kg ? '' : (_kg.name==='부동의 대장' ? '★'
                              : _kg.name==='신흥 대장'  ? 'NEW' : '');
    const crown = b.king==='nat' ? `<span class="crown nat" title="${b.kingPy||'?'}평 기준 · 전국 동급 무리 중 실거래가 1위 (전국 대장)${_kt}">👑<em>${kpy}${_kmark?" "+_kmark:""}</em></span>`
                : b.king==='gu'  ? `<span class="crown gu" title="${b.kingPy||'?'}평 기준 · 같은 시 동급 무리 중 실거래가 1위 (우리 시 대장)${_kt}">👑<em>${kpy}${_kmark?" "+_kmark:""}</em></span>`
                : '';
    const kingCls = b.king ? ` king-${b.king}` : '';
    const tagIcon=L.divIcon({className:'',iconSize:[1,1],
      html:`<div class="tag${b.plain?' plain':''}${kingCls}" id="tag-${cssId(key)}">
              ${crown}
              <div class="nm">${b.name}</div>
              <div class="pr" style="background:${color}">${b.plain?label:fmtEok(b.now)+' · '+b.pyeong+'평 '+label}</div>
            </div>`});
    const tag=L.marker([b.lat,b.lon],{icon:tagIcon});   // 흩뿌린 좌표 사용
    tag.on('click',()=>select(key));
    tag.bindPopup(()=>popupHtml(b),{maxWidth:280});

    // (B) 축소용 점
    const dotIcon=L.divIcon({className:'',iconSize:[1,1],
      html:`<div class="pin" style="background:${color}">${label}</div>`});
    const dot=L.marker([b.lat,b.lon],{icon:dotIcon});   // 흩뿌린 좌표 사용
    dot.on('click',()=>select(key));
    dot.bindPopup(()=>popupHtml(b),{maxWidth:280});

    MARKERS[key]={tag,dot};
    layerDots.addLayer(dot);
    placed++;
  }

  map.on('zoomend',syncLayers);
  syncLayers();

  document.getElementById('count').textContent = SHOW_ALL
    ? `전체 ${placed}곳 (저평가는 색깔)` : `저평가 후보 ${placed}곳`;
  document.getElementById('loading').style.display='none';
  setupMapSearch();       // [검색] 데이터 로딩 후 검색창 활성화
  setupFilters();         // [필터] 저평가율·평형·세대수
  openFromGotoHash();     // [2026-08] 차트 홈에서 📍로 넘어온 경우 그 아파트로 이동
  /* [2026-08 버그수정] today.html(패널 안)에서 다른 단지를 또 누르면 부모 창의
     해시만 바뀌고 boot 은 다시 안 돕니다. 그래서 두 번째부터는 지도가 안 움직였습니다.
     해시가 바뀔 때마다 openFromGotoHash 를 다시 부르게 연결합니다.
     (같은 주소를 또 누른 경우엔 hashchange 가 안 뜨므로, today 쪽에서도 보완합니다) */
  if(!window.__gotoBound){
    window.__gotoBound = true;
    window.addEventListener('hashchange', ()=>{
      if(/[#&]goto=/.test(location.hash)) openFromGotoHash();
    });
  }
  /* [2026-08] PC 는 화면이 넓으니 처음부터 왼쪽 패널을 펼쳐 둡니다(차트 홈).
     goto 로 들어와 이미 패널이 열렸으면 건너뜁니다. 폰은 패널이 지도를
     다 가리므로 자동으로 열지 않습니다(손잡이로 열 수 있음). */
  if(window.innerWidth >= 760 && !document.body.classList.contains('panel-open')){
    /* [첫 화면 홈 강제 · 2026-08] 예전엔 브라우저가 iframe 의 '이전 주소'(마지막에 본
       단지 해시)를 기억해, 홈 대신 그 단지 차트가 떴습니다. reopenPanel 은 src 가
       about:blank 일 때만 새로 띄워서 옛 해시가 그대로 살아 있었던 것.
       그래서 여기서 첫 화면일 때는 무조건 홈(해시 없는 chart.html)으로 다시 세팅합니다.
       (goto= 로 특정 단지를 열고 들어온 경우는 이미 panel-open 이라 이 블록을 안 탑니다) */
    var _fr = document.getElementById('panelFrame');
    if(_fr){
      /* ★ 핵심: 'chart.html#u=단지' → 'chart.html' 로 바꾸면 해시만 지워질 뿐
         브라우저가 페이지를 다시 안 읽습니다(같은 파일로 보기 때문). 그래서 옛 단지
         화면이 그대로 남았습니다. about:blank 를 한 번 거쳐 '완전히 새로' 읽게 합니다. */
      var _cur = _fr.getAttribute('src') || '';
      if(/#u=/.test(_cur) || /chart\.html/.test(_cur)){
        _fr.src = 'about:blank';
        setTimeout(function(){ _fr.src = './chart.html'; }, 30);
      } else {
        _fr.src = './chart.html';
      }
      panelKey = "__home__";
      var _pt = document.getElementById('panelTitle');
      if(_pt) _pt.textContent = "아파트 매치";
    }
    reopenPanel(true);
  }
}

/* ══ [차트 홈 → 지도 · 2026-08] ═══════════════════════════════════════════════
   왜 필요한가: 폰으로 접속하면 첫 화면이 차트 홈(chart.html)입니다. 그 홈은
   '지도 안의 창'이 아니라 단독 페이지라 부모 창이 없어서, 📍를 눌러도 지도가
   움직일 방법이 없었습니다(아무 일도 안 일어남 = 사용자가 겪은 문제).
   그래서 차트 홈이 이런 주소로 넘겨보냅니다:
       index.html?m=1#goto=지역코드|찾아갈아파트&back=지역코드|돌아갈차트
   여기서 ① 지도를 그 아파트로 옮기고 ② 돌아갈 차트를 왼쪽에 카드로 대기시킵니다.
   ※ 반드시 boot() 끝에서 부릅니다 — BEST(아파트 목록)가 채워진 뒤여야 찾습니다. */
/* [글 → 지도 · 2026-08] 왼쪽 패널의 글(today/articles)에서 단지 이름을 누르면
   이 함수가 불립니다. 지도만 그 단지로 옮기고, 왼쪽 글은 건드리지 않습니다.
   그래서 글을 계속 읽으면서 지도의 여러 단지를 눌러 볼 수 있습니다. */
window.gotoAptFromPanel = function(rc, name){
  const hit = findAptPos(rc, name);
  if(!hit){ toastMsg(name + " 은(는) 지도 위치 정보가 없어요"); return; }
  map.setView([hit.lat, hit.lon], 16, {animate:true});
  try{
    const ring = L.circleMarker([hit.lat, hit.lon], {
      radius:26, color:"#7A6DB0", weight:3, opacity:.95,
      fillColor:"#7A6DB0", fillOpacity:.12 }).addTo(map);
    setTimeout(()=>{ try{ map.removeLayer(ring); }catch(e){} }, 1600);
  }catch(e){}
};

function openFromGotoHash(){
  let h = decodeURIComponent(location.hash || "");
  /* [글 → 지도 · 2026-08] 글(오늘의 저평가 등)에서 온 손님인지 표시.
     &from=today 를 정규식에 넣기 전에 떼어내야 아파트 이름에 붙지 않습니다. */
  let fromKey = "";
  const _fm = h.match(/&from=([a-z]+)/);
  if(_fm){ fromKey = _fm[1]; h = h.replace(_fm[0], ""); }
  const m = h.match(/^#goto=([^|&]*)\|([^&]+)(?:&back=([^|&]*)\|(.+))?$/);
  if(!m) return;
  const rc = m[1], nm = m[2], brc = m[3] || "", bnm = m[4] || "";
  const hit = findAptPos(rc, nm);          // 목록 → 이름 → 좌표파일 3단계로 찾기
  if(!hit){ toastMsg(nm + " 은(는) 지도 위치 정보가 없어요"); return; }
  map.setView([hit.lat, hit.lon], 16, {animate:false});
  // 어디로 왔는지 눈에 띄게 1.6초 동안 원을 그립니다 (📍와 같은 표시)
  try{
    const ring = L.circleMarker([hit.lat, hit.lon], {
      radius:26, color:"#7A6DB0", weight:3, opacity:.95,
      fillColor:"#7A6DB0", fillOpacity:.12 }).addTo(map);
    setTimeout(()=>{ try{ map.removeLayer(ring); }catch(e){} }, 1600);
  }catch(e){}
  /* 돌아갈 차트를 왼쪽 카드로 준비. back 이 없으면(직접 주소를 친 경우 등)
     찾아온 그 아파트 차트를 대기시킵니다.                                     */
  const backName = bnm || nm, backRc = bnm ? brc : rc;
  /* [글 → 지도 · 2026-08] 글에서 단지를 누르고 온 경우:
       예전엔 무조건 차트 카드만 대기시켜서, 읽던 글이 사라지고
       돌아갈 길이 없었습니다("오늘의 저평가에서 눌렀더니 글이 없어졌다").
       · PC(화면 넓음): 그 글을 왼쪽 패널에 그대로 다시 펼칩니다
         → 지도는 단지로 옮겨졌고, 글은 계속 읽을 수 있습니다
       · 폰(화면 좁음): 패널이 지도를 다 가리므로, 대신 아래에
         "돌아가기" 단추를 띄웁니다. 누르면 글이 다시 열립니다.
     주소는 목록(허용된 페이지)에서만 고릅니다 — 밖에서 아무 주소나
     끼워 넣어 열게 하지 않기 위해서입니다. */
  const FROMP = {today:    {u:"./today.html",    t:"오늘의 저평가"},
                 articles: {u:"./articles.html", t:"읽을거리"}};
  const fp = FROMP[fromKey];
  if(fp && window.innerWidth >= 760){
    //  PC: 글을 왼쪽 패널에 펼칩니다. 이 뒤로 그 글에서 단지를 누르면
    //  글이 패널(iframe) 안에 있으므로 _goApt → gotoAptFromPanel 로 흘러,
    //  지도만 옮겨지고 글은 그대로 남습니다(두 번째 클릭부터 지도 안 움직이던 버그 해결).
    openPanelPage(fp.u, fp.t);
  }else{
    openPanel(backRc, backName);   // 차트 준비(iframe 로드) — 안에서 peek 를 풀므로
    peekPanel();                   // 바로 다시 왼쪽으로 밀어 카드만 남깁니다
    if(fp) showReturnChip(fp.u, fp.t);
  }
}

/* 패널에 차트가 아닌 '페이지'(오늘의 저평가·읽을거리)를 여는 문.
   openPanel 과 같은 방식이되, 다음 차트가 새로 실리도록 panelKey 를 비웁니다. */
function openPanelPage(url, title){
  const fr = document.getElementById('panelFrame');
  fr.src = url;
  panelKey = null;
  document.getElementById('panelTitle').textContent = title;
  unpeekPanel();
  const wasOpen = document.body.classList.contains('panel-open');
  document.body.classList.add('panel-open');
  if(!wasOpen){ try{ history.pushState({panel:true}, ''); }catch(e){} }
  setTimeout(()=>map.invalidateSize(), 280);
}

/* 패널 되열기 — 닫기 전에 보던 내용을 그대로 다시 보여줍니다.
   아직 아무것도 안 열었으면(about:blank) 차트 홈(오늘의 매치)을 싣습니다.
   silent=true 는 자동으로 열 때 쓰며, 히스토리 항목을 안 남깁니다
   (안 그러면 페이지에 들어오자마자 뒤로가기가 한 번 먹히는 이상한 상태가 됩니다). */
function reopenPanel(silent){
  const fr = document.getElementById('panelFrame');
  if(!fr.src || fr.src === 'about:blank' || /about:blank$/.test(fr.src)){
    fr.src = './chart.html';
    document.getElementById('panelTitle').textContent = '아파트 매치';
  }
  const wasOpen = document.body.classList.contains('panel-open');
  document.body.classList.add('panel-open');
  if(!wasOpen && !silent){ try{ history.pushState({panel:true}, ''); }catch(e){} }
  setTimeout(()=>map.invalidateSize(), 280);
}

/* 폰에서 쓰는 "돌아가기" 알약 단추 (지도 아래쪽 가운데) */
function showReturnChip(url, title){
  let c = document.getElementById('returnChip');
  if(!c){
    c = document.createElement('button');
    c.id = 'returnChip';
    document.body.appendChild(c);
  }
  c.textContent = '‹ ' + title + ' 계속 보기';
  c.onclick = ()=>{ c.remove(); openPanelPage(url, title); };
}

function setupFilters(){
  const g=id=>document.getElementById(id);
  const fr=g('fRate'), fk=g('fKing');
  if(!fr) return;
  const range=v=> v ? v.split('-').map(Number) : null;
  fr.onchange =()=>{ FILTER.rate=range(fr.value); applyFilter(); };
  if(fk) fk.onchange=()=>{ FILTER.king=fk.value; applyFilter(); };
  buildRanges();
}

/* ══ [범위 슬라이더 · 2026-08] 평형·세대수·연식·가격·평당가 ═══════════════════
   드롭다운("3~5억")은 칸이 정해져 있어서 원하는 구간을 못 잡습니다.
   검색 필터와 같은 '손잡이 두 개' 슬라이더로 바꿔 정밀하게 조절합니다.
   · 최소~최대 범위는 지금 지도에 올라온 단지들의 실제 값으로 잡습니다
     (전국 고정값을 쓰면 손잡이를 조금만 움직여도 다 걸러집니다)
   · 끌 때는 막대·글자만 바꾸고, 손을 뗐을 때 지도를 다시 그립니다(버벅임 방지)
   · 양끝까지 벌리면 '전체' = 필터 끔                                        */
function buildRanges(){
  const box=document.getElementById('fRanges'); if(!box) return;
  box.innerHTML='';
  const vals={py:[],hh:[],by:[],now:[],pp:[]};
  for(const k in BEST){
    const b=BEST[k];
    if(b.pyeong) vals.py.push(b.pyeong);
    if(b.hh) vals.hh.push(b.hh);
    if(b.by) vals.by.push(NOW_YEAR-b.by);
    if(b.now) vals.now.push(b.now);
    const pp = b.pp || (b.now&&b.pyeong ? Math.round(b.now/b.pyeong) : 0);
    if(pp) vals.pp.push(pp);
  }
  const mm=a=>a.length?[Math.min(...a),Math.max(...a)]:[0,1];
  const eok=v=> v>=10000 ? (v/10000).toFixed(1).replace(/\.0$/,'')+'억' : v+'만';
  /* ══ [범위 상한 묶기 · 2026-08] ═══════════════════════════════════════════
     실제 최대값을 그대로 쓰면 손잡이 한 칸이 너무 거칠어집니다.
       세대수 18~12,028세대 · 가격 1,000만~244억 · 평형 ~100평 초과
     대부분의 단지가 아래쪽에 몰려 있어서, 손잡이를 조금만 밀어도 확 걸러졌습니다.
     그래서 상한을 잘라 '그 이상'으로 묶습니다. 손잡이를 맨 끝에 두면
     상한 없음(=그 이상 전부 포함)으로 동작하므로 큰 단지가 사라지지 않습니다.  */
  const CAP = {hh:5000, now:500000, py:100, pp:10000}; // 5,000세대·50억·100평·평당1억
  const capped=(r,cap)=>[r[0], Math.min(r[1], cap)];
  const capLab=(cap,fmt)=> v => (v>=cap ? fmt(cap)+' 이상' : fmt(v));

  const mk=(title,key,lo,hi,step,fmt)=>{
    /* [2026-08] step 배수로 맞춥니다. 예전엔 min=18·step=10 이라 오른쪽 끝이
       4,998 에서 멈춰 상한(5,000)에 절대 닿지 못했고, 그래서 '이상' 표시가
       뜨지 않았습니다. */
    lo=Math.floor(lo/step)*step; hi=Math.ceil(hi/step)*step;
    if(hi<=lo) hi=lo+step;
    const cur=FILTER[key];
    let a=cur?Math.max(lo,Math.min(hi,cur[0])):lo;
    let b=cur?Math.max(lo,Math.min(hi,(cur[1]===Infinity?hi:cur[1]))):hi;
    if(a>b) a=b;
    const w=document.createElement('div');
    const isAll=(a<=lo&&b>=hi);
    w.className='frng'+(isAll?'':' on');
    w.innerHTML=`<div class="frl"><span>${title}</span>`
      +`<span><b class="frv">${isAll?'전체':fmt(a)+' ~ '+fmt(b)}</b>`
      +`${isAll?'':' <i title="전체로">✕</i>'}</span></div>`
      +`<div class="frs"><div class="trk"></div><div class="trkOn"></div>`
      +`<input type="range" class="r1" min="${lo}" max="${hi}" step="${step}" value="${a}">`
      +`<input type="range" class="r2" min="${lo}" max="${hi}" step="${step}" value="${b}"></div>`;
    const r1=w.querySelector('.r1'), r2=w.querySelector('.r2');
    const on=w.querySelector('.trkOn'), lab=w.querySelector('.frv');
    const paint=()=>{
      const A=+r1.value,B=+r2.value,W=hi-lo;
      on.style.left=((A-lo)/W*100)+'%'; on.style.width=((B-A)/W*100)+'%';
      const all=(A<=lo&&B>=hi);
      lab.textContent = all?'전체':fmt(A)+' ~ '+fmt(B);
      w.classList.toggle('on',!all);
    };
    const commit=()=>{
      const A=+r1.value,B=+r2.value;
      // 오른쪽 손잡이가 끝에 있으면 '그 이상 전부' → 상한을 무한으로 둡니다.
      //   (상한을 잘랐으니, 100평·50억·5,000세대 넘는 단지가 사라지면 안 됩니다)
      FILTER[key] = (A<=lo&&B>=hi) ? null : [A, (B>=hi ? Infinity : B)];
      applyFilter();
    };
    r1.oninput=()=>{ if(+r1.value>+r2.value) r1.value=r2.value; paint(); };
    r2.oninput=()=>{ if(+r2.value<+r1.value) r2.value=r1.value; paint(); };
    r1.onchange=commit; r2.onchange=commit;
    const x=w.querySelector('.frl i');
    if(x) x.onclick=()=>{ FILTER[key]=null; buildRanges(); applyFilter(); };
    paint();
    box.appendChild(w);
  };
  const P=capped(mm(vals.py),CAP.py), H=capped(mm(vals.hh),CAP.hh),
        B2=mm(vals.by), N=capped(mm(vals.now),CAP.now), PP=capped(mm(vals.pp),CAP.pp);
  mk('평형','py',  P[0],P[1],1,   capLab(CAP.py,  v=>v+'평'));
  mk('세대수','hh',H[0],H[1],10,  capLab(CAP.hh,  v=>v.toLocaleString()+'세대'));
  mk('연식','by',  B2[0],B2[1],1, v=>v+'년');
  mk('가격','now', N[0],N[1],500, capLab(CAP.now, eok));
  mk('평당가','pp',PP[0],PP[1],50,capLab(CAP.pp, v=>v.toLocaleString()+'만'));
}

/* ── [검색 · 2026-08] 아파트 이름 검색 → 그 위치로 지도 이동 ──
   BEST(후보 목록)에서 이름을 찾고, 고르면:
   지도 이동(줌16) + 핀 선택(패널·동급 하이라이트까지 자동) */
/* [스마트 검색 · 2026-08] "해운대 롯데" 처럼 지역+이름을 섞어 쳐도 걸리게 합니다.
   · 검색어를 공백/쉼표로 단어들로 쪼갭니다 (해운대 롯데 → ["해운대","롯데"])
   · 각 단어가 '지역명 또는 아파트명' 중 어디엔가 있으면 그 단어는 통과
   · 모든 단어가 통과해야 최종 일치 (AND) → 지역으로 좁히고 이름으로 찾습니다
   · 지역명은 "부산 해운대구"처럼 저장돼 있어, '해운대'만 쳐도 걸립니다
     ('구/시/군' 을 떼고도 비교해서 '해운대구'든 '해운대'든 다 맞습니다) */
function _norm(s){ return (s||'').replace(/\s/g,'').toLowerCase(); }
function _smartMatch(words, name, rname, dong){
  const hay1 = _norm(name);
  const hay2 = _norm(rname);
  const hay3 = hay2.replace(/(특별자치도|특별자치시|광역시|특별시|자치구|[시군구도])/g,'');
  const hayd = _norm(dong);
  //  ① 단어별로 나눠 맞추기: "해운대 롯데" → 지역=해운대 + 이름=롯데
  let all = true;
  for(const w of words){
    if(!(hay1.includes(w) || hay2.includes(w) || hay3.includes(w) || hayd.includes(w))){
      all = false; break;
    }
  }
  if(all) return true;
  //  ② 붙여 친 경우: "해운대롯데" → 지역+이름을 이어 붙여 그 안에 있는지 봅니다
  const joined = words.join('');
  //  "부산롯데"처럼 시·도만 붙여 친 경우도 잡습니다
  const sido = _norm((rname||'').split(' ')[0])
               .replace(/(특별자치도|특별자치시|광역시|특별시)/g,'');
  return (hay3+hay1).includes(joined) || (hay2+hay1).includes(joined)
      || (hayd+hay1).includes(joined) || hay1.includes(joined)
      || (sido+hay1).includes(joined);
}
function _splitQuery(raw){
  return raw.trim().toLowerCase().split(/[\s,]+/).map(x=>x.trim()).filter(Boolean);
}

function setupMapSearch(){
  const inp=document.getElementById('mapSearch');
  const box=document.getElementById('mapSearchResults');
  if(!inp||!box) return;
  const hide=()=>box.style.display='none';

  inp.addEventListener('input',()=>{
    const _raw=inp.value;
    const words=_splitQuery(_raw);
    if(!words.length){ hide(); return; }
    const q=words[words.length-1];   // 마지막 단어(대개 아파트명) — 정렬·강조에 씀
    /* [2026-08 v3] index 검색과 동급으로 재작성:
       · 같은 단지의 평형들을 묶어 "평형 N개"로 표시 (예전엔 첫 평형 하나만 나옴)
       · 매치 후보면 ⭐+저평가율, 좌표 있으면 📍(지도 이동), 없으면 📊(차트만)
       · 검색어로 '시작'하는 이름 우선 정렬 */
    /* [B단계] 검색도 all_list.js(전체 아파트)를 봅니다.
       예전엔 peerdata.units(밴드 안)만 봐서 44평 단지가 검색되지 않았습니다.
       all_list 가 없으면 예전 방식으로 자동 폴백합니다. */
    const DATA=window.__APTDATA__;
    const grp={};                      // 'rc|이름' → 묶음
    const AA=window.ALLAPT||{};
    if(Object.keys(AA).length){
      for(const id in AA){
        const a=AA[id];
        if(!_smartMatch(words, a.name, a.rname, a.dong)) continue;
        const cand=BEST[id];
        const co=COORDS_G[id];
        grp[id]={name:a.name, rname:(cand&&cand.rname)||a.rname||'',
                 pys:new Set(a.pys), rate:(cand?cand.rate:null),
                 key:(cand&&!cand.plain)?cand.key:null, rcode:a.rc,
                 //  [2026-08] 검색 결과에 보여 줄 동·세대수·연식
                 dong:a.dong||'', hh:a.hh||0, by:a.by||0,
                 hasCoord:!!(co||(cand&&cand.lat)), coordKey:id};
      }
    } else {
      const units=(DATA&&DATA.peerdata&&DATA.peerdata.units)||{};
      for(const uk in units){
        const u=units[uk];
        if(!_smartMatch(words, u.name, u.rn||'', u.dong)) continue;
        const id=u.rc+'|'+u.name;
        if(!grp[id]){
          const cand=BEST[id];
          const co=COORDS_G[id];
          grp[id]={name:u.name, rname:(cand?cand.rname:(u.rn||'')),
                   pys:new Set(), rate:cand?cand.rate:null,
                   key:cand?cand.key:null, rcode:u.rc,
                   dong:u.dong||'', hh:u.hh||0, by:u.by||0,
                   hasCoord:!!(co||cand&&cand.lat), coordKey:id};
        }
        if(u.pyeong) grp[id].pys.add(u.pyeong);
      }
    }
    const starts=x=>x.name.replace(/\s/g,'').toLowerCase().startsWith(q)?0:1;
    const hits=Object.values(grp)
      .sort((a,b)=> starts(a)-starts(b)
                 || ((b.rate!=null)-(a.rate!=null))
                 || a.name.length-b.name.length)
      .slice(0,15);
    if(!hits.length){
      box.innerHTML='<div class="empty">검색 결과 없음</div>';
      box.style.display='block'; return;
    }
    box.innerHTML=hits.map(h=>{
      const star = h.rate!=null ? ` · ⭐매치 ${(h.rate>=0?'+':'')+h.rate.toFixed(0)}%` : '';
      const mark = h.hasCoord ? '📍' : '📊';
      /* [2026-08] 동·세대수·연식을 함께 보여 줍니다.
         같은 이름 단지(롯데·현대 등)를 구분하는 데 이게 가장 도움이 됩니다. */
      const _bits=[h.rname + (h.dong? ' '+h.dong : ''), '평형 '+h.pys.size+'개'];
      if(h.hh>0) _bits.push(h.hh.toLocaleString()+'세대');
      if(h.by>0) _bits.push(h.by+'년 ('+(new Date().getFullYear()-h.by+1)+'년차)');
      return `<div class="sr">${mark} <b>${h.name}</b><span>${_bits.join(' · ')}${star}</span></div>`;
    }).join('');
    box.querySelectorAll('.sr').forEach((el,i)=>{
      el.onclick=()=>{
        const h=hits[i];
        inp.value=h.name; hide();
        if(h.hasCoord){
          const co = h.key ? BEST[h.key] : COORDS_G[h.coordKey];
          map.setView([co.lat,co.lon],16);
          if(h.key) setTimeout(()=>{ refreshTags(); select(h.key); },300);
          else openPanel(h.rcode, h.name);   // 좌표 있으나 후보 아님 → 이동+패널
        }else{
          openPanel(h.rcode, h.name);        // 좌표 없음 → 차트 패널만
        }
      };
    });
    box.style.display='block';
  });
  document.addEventListener('click',e=>{ if(!e.target.closest('.search')) hide(); });
  // 엔터 치면 첫 결과로
  inp.addEventListener('keydown',e=>{
    if(e.key==='Enter'){
      const first=box.querySelector('.sr');
      if(first) first.click();
    }
  });
}

function cssId(key){ return key.replace(/[^a-zA-Z0-9가-힣]/g,'_'); }

/* 확대 정도에 따라 말풍선 ↔ 점 전환 */
function syncLayers(){
  const z=map.getZoom();
  if(z>=ZOOM_TAG){
    if(map.hasLayer(layerDots)) map.removeLayer(layerDots);
    if(!map.hasLayer(layerTags)){
      layerTags.clearLayers();
      // 화면 안 것만 올려 성능 유지
      const bd=map.getBounds();
      for(const key in MARKERS){
        const b=BEST[key];
        if(b.lat && passFilter(b) && bd.contains([b.lat,b.lon])) layerTags.addLayer(MARKERS[key].tag);
      }
      map.addLayer(layerTags);
    }
  }else{
    if(map.hasLayer(layerTags)) map.removeLayer(layerTags);
    if(!map.hasLayer(layerDots)) map.addLayer(layerDots);
  }
}
/* 이동 시 화면 안 말풍선 갱신 */
function refreshTags(){
  if(map.getZoom()<ZOOM_TAG) return;
  layerTags.clearLayers();
  const bd=map.getBounds();
  for(const key in MARKERS){
    const b=BEST[key];
    if(b.lat && passFilter(b) && bd.contains([b.lat,b.lon])) layerTags.addLayer(MARKERS[key].tag);
  }
}

/* ══ [대장 지속성 등급 · 2026-08] ═══════════════════════════════════════════
   예전엔 대장이 '오늘의 1위'만 뜻했습니다. 그러면 5년째 부동의 1위와
   지난달에 막 역전한 신흥 1위가 똑같이 보였습니다.
   최근 N개월을 되감아 '몇 달 동안 1위였나'를 세서 셋으로 나눕니다.
     · 부동의 대장 : 판정 가능한 달의 80% 이상 1위 — 오래된 기준점
     · 신흥 대장   : 절반 미만인데 최근 6개월 안쪽으로 연속 1위 — 최근 역전(강한 신호)
     · 그냥 대장   : 그 사이 (오르내리며 1·2위를 주고받는 관계)                */
function kingGrade(b){
  const n=b.kingLen||0, w=b.kingMo||0, run=b.kingRun||0;
  if(!n) return null;
  if(w >= n*0.8) return {name:'부동의 대장', desc:`지난 ${n}개월 중 ${w}개월 1위`};
  if(w < n*0.5 && run>0 && run<=6) return {name:'신흥 대장', desc:`최근 ${run}개월 연속 1위 · 지난 ${n}개월 중 ${w}개월`};
  return {name:'대장', desc:`지난 ${n}개월 중 ${w}개월 1위`};
}

/* 팝업 내용: 현재가·동급중앙값·저평가율·동급 목록 */
function popupHtml(b){
  /* [2026-08] 조건 밖 단지(회색 핀)는 저평가 후보가 아니라 rate 가 null 입니다.
     예전엔 rate.toFixed(1) 을 그냥 불러서
     "Cannot read properties of null (reading 'toFixed')" 로 말풍선이 안 떴습니다.
     저평가율이 없으면 그 줄은 아예 안 보여주고, 평형 목록·마지막 거래를 대신 씁니다. */
  /* [2026-08] rate = (동급중앙값 - 내현재가) / 동급중앙값 × 100
       양수 = 동급보다 싸다(저평가) · 음수 = 동급보다 비싸다(고평가)
     예전엔 음수를 그대로 붙이고 뒤에 '저평가'를 달아서
     "-16.0% 저평가"(=16% 비싼데) 라고 나왔습니다. 대장인데 저평가라는 모순의 정체입니다.
     이제 부호에 따라 말을 바꿉니다. */
  const hasRate = (typeof b.rate === 'number');
  const color = hasRate ? rateColor(b.rate) : '#94A3B8';
  const rateTxt = hasRate
      ? (b.rate >= 0 ? `+${b.rate.toFixed(1)}% 저평가`
                     : `${Math.abs(b.rate).toFixed(1)}% 고평가`)
      : '';
  const sibItems=(b.sibs||[]).slice(0,6).map(s=>{
    const nm=String(s).split('|')[0];
    return `<div class="p" onclick="jumpToName('${b.regionCode}','${nm.replace(/'/g,"\\'")}')">· ${nm}</div>`;
  }).join('');
  return `<div class="pop">
    <h4>${b.name}</h4>
    <div class="sub">${b.rname} · ${b.pyeong}평${b.hh?` · ${b.hh.toLocaleString()}세대`:''}</div>
    <div class="nums">
      <div class="n"><div class="t">현재가</div><div class="v">${fmtEok(b.now)}</div></div>
      ${hasRate
        ? `<div class="n"><div class="t">동급 중앙값</div><div class="v">${fmtEok(b.sibMed)}</div></div>`
        : `<div class="n"><div class="t">평형</div><div class="v">${(b.pys&&b.pys.length)?b.pys.join('·')+'평':(b.pyeong+'평')}</div></div>`}
    </div>
    ${hasRate
      ? `<div class="rate" style="color:${color}">${b.pyeong}평 기준 ${rateTxt}</div>`
      : `<div class="rate" style="color:${color}">저평가 후보 아님${b.noRecent&&b.lastM?` · 마지막 거래 ${String(b.lastM).replace('-','.')}`:''}</div>`}
    ${(function(){
        if(!b.king) return '';
        const g=kingGrade(b);
        const who=b.king==='nat'?'전국 대장':'우리 시 대장';
        const cl=b.king==='nat'?'#7A6DB0':'#C8901E';
        return `<div style="margin:8px 0 2px;padding:8px 10px;border-radius:9px;`
          +`background:${b.king==='nat'?'#F5F1FF':'#FBF2DA'};font-size:12.5px;line-height:1.55">`
          +`<b style="color:${cl}">👑 ${who}</b>`
          +`${b.kingPy?` · ${b.kingPy}평 기준`:''}`
          +`<br><span style="color:#5B6675">동급 ${b.kingN}곳 중 실거래가 1위</span>`
          +(g?`<br><b style="color:${cl}">${g.name}</b>`
              +`<span style="color:#5B6675"> · ${g.desc}</span>`:'')
          +`</div>`;
      })()}
    ${sibItems?`<div class="peers"><div class="pt">동급 아파트 · 같은 구 기준 (누르면 이동)</div>${sibItems}</div>`:''}
    <a class="go" href="javascript:void(0)" onclick="openPanel('${b.regionCode}','${b.name.replace(/'/g,"\\'")}')">📊 차트·거래이력 보기 (구/시/전국)</a>
    <div class="hint">새 탭에서 열려요 · 지도는 그대로</div>
  </div>`;
}

/* 클릭 선택: 범위 원 + 동급 하이라이트 */
function select(key){
  const b=BEST[key]; if(!b||!b.lat) return;
  // 이전 선택 지우기
  clearSelect();
  selKey=key;
  // [B안] 핀 클릭 = 사이드 패널도 바로 열기 (아실처럼 원클릭)
  openPanel(b.regionCode, b.name);

  // ① 그 단지 주변 범위 원 (반경: 세대수에 비례, 100~250m)
  const r=Math.min(250, Math.max(100, Math.sqrt(b.hh||300)*8));
  selCircle=L.circle([b.lat,b.lon],{radius:r,color:'#7048E8',weight:2,
    fillColor:'#7048E8',fillOpacity:0.10}).addTo(map);

  // ② 같은 화면의 동급 단지 말풍선을 보라색으로
  const sibNames=new Set((b.sibs||[]).map(s=>String(s).split('|')[0]));
  for(const k in BEST){
    const o=BEST[k];
    if(k!==key && o.regionCode && sibNames.has(o.name)){
      const el=document.getElementById('tag-'+cssId(k));
      if(el) el.classList.add('sib-hl');
    }
  }
  const meEl=document.getElementById('tag-'+cssId(key));
  if(meEl) meEl.classList.add('sel');
}
/* ── [B안] 사이드 패널 제어 ─────────────────────
   openPanel: iframe 주소를 그 단지 해시로 바꾸고 패널을 엶.
   같은 단지를 또 열면 iframe 재로딩 없이 패널만 보여줌(빠름). */
let panelKey=null;
function openPanel(rcode, name){
  const url = './chart.html#u=' + encodeURIComponent(rcode + '|' + name);
  const fr = document.getElementById('panelFrame');
  const key = rcode + '|' + name;
  if(panelKey !== key){
    fr.src = url;                    // 해시가 바뀌면 index 의 hashchange 가 그 단지를 엶
    panelKey = key;
  }
  document.getElementById('panelTitle').textContent = name;
  /* [peek 해제 · 2026-08] 차트를 왼쪽에 밀어둔 상태에서 지도의 다른 아파트를 누르면
     그 아파트 차트로 갈아타면서 바로 다시 열립니다(사용자 선택 사항).           */
  unpeekPanel();
  const wasOpen = document.body.classList.contains('panel-open');
  document.body.classList.add('panel-open');
  // [뒤로가기 · 2026-08] 패널 열 때 히스토리 항목 추가 →
  // 폰 뒤로가기를 누르면 사이트를 나가는 대신 패널만 닫힘
  if(!wasOpen){
    try{ history.pushState({panel:true}, ''); }catch(e){}
  }
  setTimeout(()=>map.invalidateSize(), 280);   // 지도 크기 재계산 (패널로 밀린 뒤)
}
function closePanel(fromPop){
  const wasOpen = document.body.classList.contains('panel-open');
  unpeekPanel();                     // [2026-08] 밀어둔 상태였다면 먼저 원위치(잔상 방지)
  document.body.classList.remove('panel-open');
  // ×버튼 등으로 직접 닫을 땐, 우리가 넣어둔 히스토리 항목도 하나 되돌림
  if(wasOpen && !fromPop){
    try{ history.back(); }catch(e){}
  }
  setTimeout(()=>map.invalidateSize(), 280);
}
// [뒤로가기] 폰/브라우저 뒤로가기 → 패널이 열려 있으면 패널만 닫고 지도 유지
window.addEventListener('popstate', ()=>{
  if(document.body.classList.contains('panel-open')){
    closePanel(true);   // fromPop=true: 이미 뒤로가기가 일어났으니 history.back 재호출 안 함
  }
});
/* ══ [📍 지도 보기 · peek 제어 · 2026-08] ══════════════════════════════════════
   왜 필요한가: 모바일은 차트 패널이 화면을 100% 덮습니다. 차트 안에서 📍를 눌러
   "이 동급 아파트가 지도에서 어디인지" 보려 해도 지도가 안 보였습니다.
   그래서 패널을 닫지 않고 왼쪽으로 밀어(peek) 36px 손잡이만 남깁니다.
     · peekPanel()   : 밀어두기 (모바일에서만. PC는 지도가 이미 옆에 보이므로 그대로)
     · unpeekPanel() : 원위치 (손잡이 드래그/탭, 다른 마커 클릭, 패널 닫기)
   ※ 인라인 transform 을 반드시 지웁니다. 안 지우면 드래그 중 위치에 굳어버립니다. */
const PEEK_EDGE = 22;                                   // 남겨 둘 손잡이 폭(px) — CSS와 같은 값
function isMobileView(){ return window.matchMedia('(max-width:760px)').matches; }
function peekPanel(){
  if(!document.body.classList.contains('panel-open')) return;   // 패널이 안 열려 있으면 할 일 없음
  if(!isMobileView()) return;                                   // PC는 지도가 이미 보임
  const p=document.getElementById('panel');
  if(p){ p.style.transition=''; p.style.transform=''; }          // 이전 드래그 잔상 제거
  document.body.classList.add('panel-peek');
}
function unpeekPanel(){
  const p=document.getElementById('panel');
  if(p){ p.style.transition=''; p.style.transform=''; }
  document.body.classList.remove('panel-peek');
}
/* [손잡이 드래그] 오른쪽으로 일정 거리 끌면 복귀, 조금만 끌면 다시 숨음.
   톡 누르기(탭)만 해도 복귀합니다 — 손잡이가 좁아 실수로 눌리기 어렵습니다.     */
(function(){
  const grip=document.getElementById('peekGrip');
  if(!grip) return;
  const panel=()=>document.getElementById('panel');
  let sx=0, sy=0, dx=0, dragging=false;
  const BACK_PX = 70;                       // 이만큼 오른쪽으로 끌면 차트 복귀
  const follow=(px)=>{                      // 손가락을 따라 패널을 살짝 끌어당김
    const p=panel(); if(!p) return;
    p.style.transition='none';
    p.style.transform=`translateX(calc(-100% + ${PEEK_EDGE + px}px))`;
  };
  const start=(x,y)=>{ sx=x; sy=y; dx=0; dragging=true; };
  const move=(x,y)=>{
    if(!dragging) return;
    dx=x-sx;
    /* 오른쪽(양수)으로만 따라갑니다. 왼쪽으로 끌어도 더 숨길 곳이 없습니다.
       세로로 크게 움직이면 지도를 만지려는 것으로 보고 취소합니다.            */
    if(Math.abs(y-sy) > 60 && Math.abs(y-sy) > Math.abs(dx)*1.5){ end(true); return; }
    follow(Math.max(0, Math.min(dx, window.innerWidth)));
  };
  const end=(cancel)=>{
    if(!dragging) return;
    dragging=false;
    const p=panel(); if(p) p.style.transition='';               // 부드러운 애니메이션 복구
    if(!cancel && dx > BACK_PX){ unpeekPanel(); }               // 충분히 끌었다 → 차트 복귀
    else if(!cancel && Math.abs(dx) < 6){ unpeekPanel(); }      // 톡 누름(탭) → 차트 복귀
    else if(p){ p.style.transform=''; }                          // 애매하면 다시 숨은 상태로
  };
  grip.addEventListener('touchstart',e=>{
    e.preventDefault(); e.stopPropagation();                     // 지도 이동·페이지 스크롤 차단
    const t=e.touches[0]; start(t.clientX, t.clientY);
  },{passive:false});
  grip.addEventListener('touchmove',e=>{
    e.preventDefault(); e.stopPropagation();
    const t=e.touches[0]; move(t.clientX, t.clientY);
  },{passive:false});
  grip.addEventListener('touchend',e=>{ e.preventDefault(); e.stopPropagation(); end(false); },{passive:false});
  grip.addEventListener('touchcancel',()=>end(true),{passive:true});
  // PC에서도 같은 방식으로 동작(창을 좁혔을 때 대비)
  grip.addEventListener('mousedown',e=>{ e.preventDefault(); start(e.clientX,e.clientY); });
  window.addEventListener('mousemove',e=>{ if(dragging) move(e.clientX,e.clientY); });
  window.addEventListener('mouseup',()=>end(false));
})();
/* [화면 회전 대비 · 2026-08] 폰을 가로로 돌리면 폭이 760px를 넘어 PC 규칙이 됩니다.
   그러면 패널은 화면에 다시 나타나는데 'panel-peek' 딱지만 남아 어긋납니다.
   (다시 세로로 돌리면 사용자가 아무것도 안 했는데 차트가 숨어 있음)
   그래서 PC 폭이 되는 순간 숨김 상태를 깔끔히 풉니다.                          */
window.addEventListener('resize', ()=>{
  if(!isMobileView() && document.body.classList.contains('panel-peek')) unpeekPanel();
});
/* ══ [🗺 지도로 돌아가기 · 2026-08] ═══════════════════════════════════════════
   예전 🗺 는 패널을 '완전히 닫기'였습니다. 그러면 다시 보려고 마커를 또 찾아
   눌러야 했습니다(차트가 사라짐). 이제 모바일에서는 닫지 않고 왼쪽으로
   밀어둡니다 → 왼쪽 카드 손잡이를 오른쪽으로 끌면 그 차트가 그대로 돌아옵니다.
     · 모바일 : 밀어두기(peek). 완전히 끝내려면 폰 뒤로가기 버튼.
     · PC     : 지도가 이미 옆에 보이므로 예전처럼 닫기.                        */
function hideToMap(){
  if(isMobileView() && document.body.classList.contains('panel-open')){
    peekPanel();
    return;
  }
  closePanel();
}
/* ══ [아파트 위치 찾기 · 2026-08] ═════════════════════════════════════════════
   📍가 눌렸을 때 "지도에서 그 아파트가 어디인가"를 찾는 공용 도우미입니다.
   왜 새로 만드나: 예전엔 지도 목록(BEST)만 봤습니다. 그런데 BEST 는
   **좌표가 있는 아파트만** 담습니다(좌표 없으면 마커를 못 찍으니까).
   게다가 조건에 따라 목록에서 빠지는 단지도 있어, 동급 아파트를 눌렀는데
   목록에 없으면 아무 일도 안 일어났습니다 — 이게 "📍가 안 먹는다"의 원인입니다.
   그래서 ① 목록 → ② 이름만으로 목록 → ③ 좌표 파일(coords.json) 직접
   3단계로 찾습니다. 좌표 파일에만 있어도 지도는 옮길 수 있습니다.             */
function findAptPos(rc, nm){
  if(!nm) return null;
  let h = BEST[rc + "|" + nm];                                  // ① 지역코드+이름
  if(!h) for(const k in BEST){ if(BEST[k].name === nm){ h = BEST[k]; break; } }  // ② 이름만
  if(h && h.lat) return { lat:h.lat, lon:h.lon };
  const C = window.COORDS_G || {};                              // ③ 좌표 파일에서 직접
  let co = C[rc + "|" + nm];
  if(!co) for(const k in C){ if(k.slice(k.indexOf("|") + 1) === nm){ co = C[k]; break; } }
  if(co && co.lat) return { lat:co.lat, lon:co.lon };
  console.warn("[지도이동] 좌표를 못 찾았어요:", rc, nm);
  return null;
}
/* [안내 쪽지] 화면 아래에 잠깐 떴다 사라지는 알림. 조용한 실패를 없애기 위한 것.
   왜 alert 를 안 쓰나: alert 는 확인을 눌러야 사라져서 흐름이 끊깁니다.        */
function toastMsg(msg){
  let t = document.getElementById("aptToast");
  if(!t){
    t = document.createElement("div");
    t.id = "aptToast";
    t.style.cssText = "position:fixed;left:50%;bottom:80px;transform:translateX(-50%);"
      + "background:rgba(24,20,16,.92);color:#fff;font-size:13px;font-weight:700;"
      + "padding:10px 16px;border-radius:20px;z-index:99999;max-width:82%;text-align:center;"
      + "box-shadow:0 4px 16px rgba(0,0,0,.3);pointer-events:none;opacity:0;"
      + "transition:opacity .18s ease";
    document.body.appendChild(t);
  }
  t.textContent = msg;
  t.style.opacity = "1";
  clearTimeout(toastMsg._tm);
  toastMsg._tm = setTimeout(()=>{ t.style.opacity = "0"; }, 2600);
}
function openPanelTab(){             // 새 탭에서 크게 보기
  if(panelKey) window.open('./chart.html#u=' + encodeURIComponent(panelKey), '_blank');
}
/* [리사이즈 · 2026-08] 패널 오른쪽 모서리를 끌면 폭이 넓어짐 (320~80%까지).
   차트를 크게 보고 싶을 때 답답함 해소용. iframe 위 드래그가 끊기지 않게
   드래그 중엔 iframe 마우스를 잠시 꺼 둡니다. */
(function(){
  const handle=document.getElementById('panelResize');
  const fr=document.getElementById('panelFrame');
  if(!handle) return;
  let dragging=false;
  handle.addEventListener('mousedown',e=>{
    dragging=true; document.body.classList.add('resizing');
    fr.style.pointerEvents='none'; e.preventDefault();
  });
  document.addEventListener('mousemove',e=>{
    if(!dragging) return;
    const w=Math.min(window.innerWidth*0.8, Math.max(320, e.clientX));
    document.documentElement.style.setProperty('--panelW', w+'px');
    map.invalidateSize();
  });
  document.addEventListener('mouseup',()=>{
    if(!dragging) return;
    dragging=false; document.body.classList.remove('resizing');
    fr.style.pointerEvents='';
    map.invalidateSize();
  });
})();

function clearSelect(){
  if(selCircle){ map.removeLayer(selCircle); selCircle=null; }
  document.querySelectorAll('.tag.sel,.tag.sib-hl')
    .forEach(el=>el.classList.remove('sel','sib-hl'));
  selKey=null;
}

/* 동급 이름 클릭 → 그 단지로 지도 이동 */
/* ══ [차트 → 지도 이동 · 2026-08] ═══════════════════════════════════════════
   차트는 이 페이지 안의 iframe(사이드 패널)에서 돕니다. 그 안에서 동급 이름 옆
   📍를 누르면 이런 메시지를 보내옵니다. 받아서 지도를 그 아파트로 옮깁니다.
   왜 필요한가: 차트에 "코오롱하늘채2차 5.5억"이라고 나와도 그게 지도 어디인지
   찾으려면 검색을 다시 해야 했습니다. 한 번 눌러 바로 가게 합니다.            */
window.addEventListener("message", (ev)=>{
  const d = ev.data;
  /* [지도 카드 · 2026-08] 차트(iframe) 오른쪽 카드를 왼쪽으로 끌면 이 신호가 옵니다.
     패널을 닫지 않고 왼쪽으로 밀어두기만 하면 지도가 보입니다(차트는 대기).      */
  if(d && d.type === "aptmatch:showmap"){ peekPanel(); return; }
  if(!d || d.type !== "aptmatch:goto") return;
  /* 아래 console.warn 세 줄은 정상 동작에서는 찍히지 않습니다.
     📍를 눌러도 지도가 안 움직이는 일이 생기면 콘솔에서 이유를 바로 알 수 있게
     남겨 둡니다(이름 없음 / 지도에 없는 아파트 / 좌표 없음). */
  const nm = String(d.name||"").trim();
  if(!nm){ console.warn("[지도이동] 아파트 이름이 비어 있어요"); return; }
  const rc = String(d.rc||"");
  const _p = findAptPos(rc, nm);
  if(!_p){
    /* [2026-08] 예전엔 콘솔에만 남기고 조용히 끝났습니다. 그래서 사용자는
       "📍를 눌러도 아무 일도 안 일어난다"고만 느꼈습니다. 이제 이유를 화면에
       띄웁니다(좌표가 없는 아파트는 전체의 1% 정도 남아 있습니다).            */
    toastMsg(nm + " 은(는) 지도 위치 정보가 없어요");
    return;
  }
  const hit = { lat:_p.lat, lon:_p.lon };
  /* [2026-08 수정] 예전엔 jumpToName 을 썼는데, 그 함수는 지도를 옮긴 뒤
     select() 까지 불러서 **차트 패널이 그 아파트로 바뀌어** 버렸습니다.
     📍는 "지도에서 어디인지 보여 달라"는 뜻이므로, 보고 있던 차트는 그대로 두고
     지도만 옮기고 말풍선만 띄웁니다. */
  /* [순서 수정 · 2026-08] 예전엔 지도를 먼저 옮기고 패널을 닫았습니다.
     그런데 패널이 닫히면 지도 크기가 바뀌고, 그때 지도가 보기를 다시 맞추면서
     방금 옮긴 위치가 되돌아갔습니다(그래서 아예 안 움직이는 것처럼 보였습니다).
     그래서 ① 패널을 먼저 닫고 ② 지도 크기를 다시 잡은 뒤 ③ 옮깁니다. */
  /* [원인 · 2026-08] closePanel() 안에 history.back() 이 있습니다.
     뒤로가기가 일어나면서 지도 보기가 되돌아가, 옮겼다가 제자리로 왔습니다.
     또 closePanel 이 280ms 뒤 invalidateSize() 를 한 번 더 불러 흔들립니다.
     그래서 ① 히스토리를 건드리지 않고 패널만 접고(클래스만 제거)
            ② closePanel 의 뒷정리가 끝난 뒤(320ms) 옮깁니다. */
  /* [2026-08 최종] 패널(차트)을 닫지 않습니다.
     닫으면 보고 있던 차트가 사라져 버립니다 — 📍는 "이 동급 아파트가 어디 있나"만
     확인하는 것이므로, 차트는 그대로 두고 그 옆 지도만 옮깁니다. */
  /* [2026-08 모바일 추가] 다만 모바일은 패널이 화면을 100% 덮어 지도가 안 보였습니다.
     그래서 닫지는 않고 왼쪽으로 밀어둡니다(peek) → 손잡이를 끌면 차트로 복귀.
     PC는 지도가 이미 패널 옆에 있으므로 peekPanel() 이 스스로 아무것도 안 합니다.
     ※ 모바일 지도는 항상 화면 전체 폭(body.panel-open #map{left:0})이라
       패널을 밀어도 지도 크기가 안 바뀝니다 → invalidateSize 불필요(위치 흔들림 없음). */
  peekPanel();
  setTimeout(()=>{
    map.setView([hit.lat, hit.lon], 16, {animate:false});
    /* [2026-08] 말풍선은 띄우지 않습니다. 📍는 "이 동급 아파트가 어디에 있나"만
       확인하는 용도이므로, 말풍선까지 열면 보던 흐름을 끊습니다.
       대신 그 마커 자리에 잠깐 원을 그려 눈에 띄게만 합니다(1.6초 뒤 사라짐). */
    try{
      const ring = L.circleMarker([hit.lat, hit.lon], {
        radius: 26, color: "#7A6DB0", weight: 3, opacity: .95,
        fillColor: "#7A6DB0", fillOpacity: .12
      }).addTo(map);
      setTimeout(()=>{ try{ map.removeLayer(ring); }catch(e){} }, 1600);
    }catch(e){}
  }, 60);
});

function jumpToName(rcode,name){
  // 같은 지역 우선, 없으면 전체에서 이름으로
  let target=BEST[rcode+'|'+name];
  if(!target){
    for(const k in BEST){ if(BEST[k].name===name){ target=BEST[k]; break; } }
  }
  if(target&&target.lat){
    map.setView([target.lat,target.lon],16);
    setTimeout(()=>{ select(target.key); refreshTags(); },300);
  }
}

function fail(msg){
  document.getElementById('loading').innerHTML=
    `<div style="color:#E5484D;font-size:14px">⚠️ ${msg}</div>
     <div style="font-size:12px">py -m http.server 8000 → http://localhost:8000/map.html</div>`;
}

boot();

/* ══ [PC 첫 화면 · 2026-08] 왼쪽에 아파트매치 홈(오늘의 매치)을 미리 띄웁니다 ══════
   왜: 예전엔 PC 로 처음 열면 오른쪽 지도만 보이고 왼쪽이 비어 있었습니다.
       이제 처음부터 왼쪽 패널에 chart.html 홈(오늘의 매치·구별 보기·소개)을 띄워
       "왼쪽 메인 + 오른쪽 지도"가 함께 보이게 합니다.
   안전장치:
     · 폰(<760px)은 이미 chart.html 로 넘어가므로 여기서 아무 것도 안 함.
     · 아파트를 눌러 특정 단지 차트를 열면 그쪽이 우선(panelKey 로 구분).
     · 히스토리(pushState)는 넣지 않습니다 → 첫 화면에서 뒤로가기 눌러도
       사이트를 안 나가고 그대로 유지(홈은 '기본 상태'라 되돌릴 대상이 아님). */
function openHomePanel(){
  if(window.innerWidth < 760) return;        // 폰은 제외 (이미 chart.html 홈)
  const fr = document.getElementById('panelFrame');
  if(!fr) return;
  if(panelKey === "__home__") return;        // 이미 홈이면 다시 안 함
  fr.src = './chart.html';                    // 해시 없음 = 홈(오늘의 매치)
  panelKey = "__home__";
  const tt = document.getElementById('panelTitle');
  if(tt) tt.textContent = "아파트 매치";
  document.body.classList.add('panel-open');
  setTimeout(()=>{ try{ map.invalidateSize(); }catch(e){} }, 300);
}
// 지도 준비가 끝난 뒤 홈을 띄웁니다 (map 이 생기면 실행)
(function waitMapThenHome(){
  const t = setInterval(()=>{
    if(typeof map !== "undefined" && map){ clearInterval(t); openHomePanel(); }
  }, 120);
  setTimeout(()=>clearInterval(t), 6000);     // 6초 넘으면 그만 (안전)
})();

// 지도 이동 멈추면 화면 안 말풍선 갱신
document.addEventListener('DOMContentLoaded',()=>{ 
  const t=setInterval(()=>{ if(map){ map.on('moveend',refreshTags); clearInterval(t);} },200);
});
</script>
