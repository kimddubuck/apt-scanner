<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>아파트 매치 지도</title>

<!-- Leaflet (무료 지도 라이브러리) -->
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css">
<script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>

<style>
  :root{
    --ink:#1a1f26; --soft:#6B7684; --line:#E5E9EF; --bg:#F7F9FC;
    --hot:#E5484D; --warm:#F5A524; --cool:#3E9B4F; --accent:#C6A15B;
    --sib:#7048E8;   /* 동급 하이라이트 보라 */
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;font-family:-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;color:var(--ink)}
  #map{position:absolute;inset:0;top:94px;transition:left .25s ease}
  /* [필터바] 상단바 바로 아래, 아실식 칩 느낌 */
  .filterbar{position:absolute;top:52px;left:0;right:0;height:42px;z-index:999;
    background:rgba(255,255,255,.92);backdrop-filter:blur(8px);
    border-bottom:1px solid rgba(0,0,0,.06);
    display:flex;align-items:center;gap:8px;padding:0 12px;overflow-x:auto}
  .filterbar select{border:1.5px solid var(--line);border-radius:999px;
    padding:5px 10px;font-size:12.5px;font-family:inherit;background:#fff;
    color:var(--ink);font-weight:600;outline:none;flex:none}
  .filterbar select:focus{border-color:var(--accent)}
  /* ── [B안 · 아실식 사이드 패널] ─────────────────
     핀 클릭 → 왼쪽에서 패널이 열리고 지도가 오른쪽으로 밀림.
     패널 안에는 기존 index.html 을 iframe(창문)으로 끼움 →
     차트·구시전국·거래이력 등 기존 기능이 100% 그대로 작동. */
  body.panel-open #map{left:var(--panelW,420px)}
  #panel{position:absolute;top:94px;bottom:0;left:calc(-1*var(--panelW,420px) - 10px);width:var(--panelW,420px);z-index:900;
    background:#fff;border-right:1px solid rgba(0,0,0,.08);
    box-shadow:4px 0 20px rgba(0,0,0,.08);transition:left .25s ease;
    display:flex;flex-direction:column}
  body.panel-open #panel{left:0}
  #panel .phead{display:flex;align-items:center;gap:8px;padding:10px 12px;
    border-bottom:1px solid var(--line);flex:none}
  #panel .phead .pt{font-weight:800;font-size:14px;flex:1;white-space:nowrap;
    overflow:hidden;text-overflow:ellipsis}
  #panel .phead button{border:0;background:#F0F1F4;width:30px;height:30px;
    border-radius:8px;cursor:pointer;font-size:15px;flex:none}
  #panel iframe{flex:1;border:0;width:100%}
  /* [리사이즈] 패널 오른쪽 가장자리를 잡고 끌면 넓어짐 (요청: 차트 크게 보기) */
  #panelResize{position:absolute;top:0;right:-5px;width:10px;height:100%;
    cursor:ew-resize;z-index:950}
  #panelResize:hover{background:rgba(112,72,232,.15)}
  body.resizing{cursor:ew-resize;user-select:none}
  body.resizing #panel,body.resizing #map{transition:none}
  @media (max-width:760px){          /* 모바일: 패널이 화면 대부분 차지 */
    body.panel-open #map{left:0}
    #panel{width:100%;left:-100%}
    body.panel-open #panel{left:0}
  }

  .topbar{position:absolute;top:0;left:0;right:0;height:52px;z-index:1000;
    background:rgba(255,255,255,.88);backdrop-filter:blur(10px);
    border-bottom:1px solid rgba(0,0,0,.06);
    display:flex;align-items:center;gap:12px;padding:0 14px}
  .topbar .logo{font-weight:800;font-size:16px}
  .topbar .logo em{color:var(--accent);font-style:normal}
  .topbar .count{font-size:12px;color:var(--soft);margin-left:auto}
  .topbar a{font-size:12px;color:var(--soft);text-decoration:none;
    border:1px solid rgba(0,0,0,.08);background:rgba(255,255,255,.7);
    border-radius:8px;padding:6px 10px}
  /* [검색] 지도 상단 검색창 — 치면 목록이 뜨고, 고르면 그 단지로 지도 이동 */
  .topbar .search{position:relative;flex:1;max-width:320px}
  .topbar .search input{width:100%;border:1.5px solid var(--line);border-radius:10px;
    padding:7px 12px;font-size:13px;font-family:inherit;outline:none;background:#fff}
  .topbar .search input:focus{border-color:var(--accent)}
  .sr-box{position:absolute;top:38px;left:0;right:0;background:#fff;
    border:1px solid var(--line);border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,.12);
    max-height:300px;overflow:auto;display:none;z-index:2000}
  .sr-box .sr{padding:9px 12px;font-size:13px;cursor:pointer;border-bottom:1px solid #F4F6F9}
  .sr-box .sr:hover{background:#F7F9FC}
  .sr-box .sr b{font-weight:700}
  .sr-box .sr span{color:var(--soft);font-size:11.5px;margin-left:6px}
  .sr-box .empty{padding:12px;font-size:12.5px;color:var(--soft)}

  .legend{position:absolute;bottom:20px;left:12px;z-index:1000;
    background:rgba(255,255,255,.92);backdrop-filter:blur(8px);
    border:1px solid rgba(0,0,0,.06);border-radius:12px;padding:10px 12px;font-size:12px;
    box-shadow:0 4px 20px rgba(0,0,0,.10)}
  .legend b{display:block;margin-bottom:6px}
  .legend .row{display:flex;align-items:center;gap:6px;margin:3px 0;color:var(--soft)}
  .legend .dot{width:12px;height:12px;border-radius:50%;flex:none}
  .legend .dot.sq{border-radius:3px;background:var(--sib)}

  /* ── 말풍선 핀 v3 · 아실식 시인성 ─────────────
     [2026-08] 글자가 작고 어둡다는 피드백 반영:
     · 이름: 13px 흰 배경 + 진한 남색 글씨 (아실의 흰바탕 파란글씨처럼 대비↑)
     · 가격: 12px, 색 배지는 유지하되 더 크게
     · 흰 테두리 + 진한 그림자로 지도 위에서 또렷하게 */
  .tag{transform:translate(-50%,-100%);cursor:pointer;
    filter:drop-shadow(0 2px 5px rgba(0,0,0,.35))}
  .tag .nm{background:#fff;color:#1B3A6B;font-size:13px;font-weight:800;
    padding:3.5px 10px;border-radius:8px 8px 0 0;white-space:nowrap;text-align:center;
    letter-spacing:-0.3px;border:1.5px solid #1B3A6B;border-bottom:0}
  .tag .pr{color:#fff;font-size:12px;font-weight:800;padding:3px 10px;
    border-radius:0 0 8px 8px;white-space:nowrap;text-align:center;
    letter-spacing:-0.2px;border:1.5px solid rgba(0,0,0,.12);border-top:0}
  .tag::after{content:"";display:block;width:0;height:0;margin:0 auto;
    border:5px solid transparent;border-top-color:#1B3A6B}
  .tag.sel .nm{background:var(--sib);color:#fff;border-color:var(--sib)}
  .tag.sel::after{border-top-color:var(--sib)}
  .tag.sib-hl .nm{background:var(--sib);color:#fff;border-color:var(--sib)}
  .tag.sib-hl::after{border-top-color:var(--sib)}
  .tag:hover{filter:drop-shadow(0 4px 10px rgba(0,0,0,.45))}

  /* 축소 시 쓰는 작은 점 핀 */
  .pin{border-radius:14px;padding:3px 9px;font-size:12.5px;font-weight:800;color:#fff;
    white-space:nowrap;box-shadow:0 2px 8px rgba(0,0,0,.35);border:2px solid #fff;
    transform:translate(-50%,-50%);cursor:pointer}

  .pop{min-width:220px}
  .pop h4{margin:0 0 2px;font-size:15px}
  .pop .sub{color:var(--soft);font-size:12px;margin-bottom:8px}
  .pop .nums{display:flex;gap:10px;margin-bottom:8px}
  .pop .nums .n{flex:1;background:var(--bg);border-radius:8px;padding:6px 8px}
  .pop .nums .t{font-size:10px;color:var(--soft)}
  .pop .nums .v{font-size:14px;font-weight:800}
  .pop .rate{font-size:18px;font-weight:800;margin-bottom:6px}
  .pop .peers{border-top:1px solid var(--line);padding-top:8px;margin-top:4px}
  .pop .peers .pt{font-size:11px;color:var(--soft);margin-bottom:4px}
  .pop .peers .p{font-size:12px;padding:2px 0;cursor:pointer;color:#3B5BDB}
  .pop .peers .p:hover{text-decoration:underline}
  .pop .hint{font-size:10.5px;color:var(--soft);margin-top:8px}
  .pop .go{display:block;text-align:center;margin-top:10px;background:#2B3A55;color:#fff;
    text-decoration:none;border-radius:8px;padding:9px;font-size:13px;font-weight:700}
  .pop .go:hover{background:#3d5175}

  .loading{position:absolute;inset:52px 0 0;display:flex;align-items:center;justify-content:center;
    flex-direction:column;gap:10px;color:var(--soft);z-index:500;background:var(--bg)}
  .spin{width:32px;height:32px;border:3px solid var(--line);border-top-color:var(--accent);
    border-radius:50%;animation:sp .8s linear infinite}
  @keyframes sp{to{transform:rotate(360deg)}}
</style>
</head>
<body>

<div class="topbar">
  <div class="logo">아파트 <em>매치</em> 지도</div>
  <div class="search">
    <input id="mapSearch" type="text" placeholder="아파트 검색 🔍" autocomplete="off">
    <div class="sr-box" id="mapSearchResults"></div>
  </div>
  <span class="count" id="count">불러오는 중…</span>
  <a href="./chart.html">📋 차트 목록</a>
</div>

<!-- [필터 · 2026-08] 아실처럼 지도 위 필터 — 골라 켜면 핀이 걸러짐 -->
<div class="filterbar">
  <select id="fRate">
    <option value="0">저평가 전체</option>
    <option value="10">10% 이상</option>
    <option value="20">20% 이상</option>
  </select>
  <select id="fPy">
    <option value="">평형 전체</option>
    <option value="23-27">23~27평</option>
    <option value="28-32">28~32평</option>
    <option value="33-40">33~40평</option>
  </select>
  <select id="fHh">
    <option value="0">세대수 전체</option>
    <option value="300">300세대~</option>
    <option value="500">500세대~</option>
    <option value="1000">1000세대~</option>
  </select>
  <select id="fBy">
    <option value="">입주 전체</option>
    <option value="0-5">5년 이내</option>
    <option value="5-10">5~10년</option>
    <option value="10-20">10~20년</option>
    <option value="20-99">20년 이상</option>
  </select>
  <select id="fNow">
    <option value="">가격 전체</option>
    <option value="0-30000">3억 이하</option>
    <option value="30000-50000">3~5억</option>
    <option value="50000-100000">5~10억</option>
    <option value="100000-999999999">10억 이상</option>
  </select>
  <select id="fPp">
    <option value="">평당가 전체</option>
    <option value="0-1500">1500만 이하</option>
    <option value="1500-2500">1500~2500만</option>
    <option value="2500-4000">2500~4000만</option>
    <option value="4000-999999">4000만 이상</option>
  </select>
</div>

<div id="map"></div>

<!-- [B안] 아실식 사이드 패널: 기존 index.html 을 창문(iframe)으로 -->
<div id="panel">
  <div class="phead">
    <div class="pt" id="panelTitle">단지 상세</div>
    <button onclick="openPanelTab()" title="새 탭에서 크게 보기">⧉</button>
    <button onclick="closePanel()" title="닫기">×</button>
  </div>
  <iframe id="panelFrame" src="about:blank"></iframe>
  <div id="panelResize" title="끌어서 넓히기 ↔"></div>
</div>

<div class="legend">
  <b>저평가율 (동급 대비)</b>
  <div class="row"><span class="dot" style="background:#E5484D"></span> 20% 이상</div>
  <div class="row"><span class="dot" style="background:#F5A524"></span> 10~20%</div>
  <div class="row"><span class="dot" style="background:#3E9B4F"></span> 10% 미만</div>
  <div class="row"><span class="dot sq"></span> 선택한 단지의 동급</div>
</div>

<div class="loading" id="loading">
  <div class="spin"></div>
  <div>지도와 데이터를 불러오는 중…</div>
</div>

<script>
/* [모바일 첫화면 · 2026-08] 폰(<760px)으로 그냥 접속하면 차트 홈이 먼저 뜨게.
   지도는 차트 홈의 "지도로 보기" 버튼(?m=1)으로 들어옵니다.
   PC 는 지도가 그대로 첫 화면. */
if(window.innerWidth<760 && location.search.indexOf('m=1')<0){
  location.replace('./chart.html');
}
function rateColor(r){ if(r>=20)return'#E5484D'; if(r>=10)return'#F5A524'; return'#3E9B4F'; }
function fmtEok(man){ if(!man)return'-'; return (man/10000).toFixed(1)+'억'; }

let map, layerTags, layerDots, selCircle=null, selKey=null;
/* [필터 · 2026-08] 저평가율·평형·세대수 조건. 바꾸면 핀이 즉시 걸러짐 */
const NOW_YEAR = new Date().getFullYear();
const FILTER = { rate:0, py:null, hh:0, by:null, now:null, pp:null };
function passFilter(b){
  if(!b) return false;
  if((b.rate||0) < FILTER.rate) return false;
  if(FILTER.hh && (b.hh||0) < FILTER.hh) return false;
  if(FILTER.py && !(b.pyeong>=FILTER.py[0] && b.pyeong<=FILTER.py[1])) return false;
  // 입주년차 = 올해 - 건축년도 (by 0이면 미상 → 필터 켜면 제외)
  if(FILTER.by){
    const age = b.by ? (NOW_YEAR - b.by) : -1;
    if(age<0 || age<FILTER.by[0] || age>FILTER.by[1]) return false;
  }
  // 현재가(만원)
  if(FILTER.now){
    if(!b.now || b.now<FILTER.now[0] || b.now>FILTER.now[1]) return false;
  }
  // 평당가(만원)
  if(FILTER.pp){
    if(!b.pp || b.pp<FILTER.pp[0] || b.pp>FILTER.pp[1]) return false;
  }
  return true;
}
function applyFilter(){
  layerDots.clearLayers();
  let n=0;
  for(const key in MARKERS){
    if(passFilter(BEST[key])){ layerDots.addLayer(MARKERS[key].dot); n++; }
  }
  refreshTags(); syncLayers();
  document.getElementById('count').textContent = `표시 ${n}곳`;
}
let BEST={}, MARKERS={}, COORDS_G={};          // key → 후보정보 / key → {tag, dot}
const ZOOM_TAG = 14;              // 이 배율 이상이면 이름 말풍선, 미만이면 점

async function boot(){
  await new Promise((ok,err)=>{ const s=document.createElement('script');
    s.src='./data.js'; s.onload=ok; s.onerror=()=>err(); document.head.appendChild(s); });
  const DATA = window.__APTDATA__;
  if(!DATA){ fail('data.js 에 데이터가 없어요'); return; }

  let COORDS;
  try{ COORDS = await (await fetch('./coords.json')).json(); window.COORDS_G = COORDS; }
  catch(e){ fail('coords.json 못 읽음 — http 서버로 열어주세요'); return; }
  COORDS_G = COORDS;      // [검색용] 전역 보관

  // 후보 정리: 같은 단지는 저평가율 큰 평형 대표. 동급 중앙값(sibMed)도 보관.
  for(const reg of DATA.regions||[]){
    for(const c of reg.candidates||[]){
      const key = reg.code + '|' + c.name;
      const prev = BEST[key];
      if(!prev || (c.rate||0) > prev.rate){
        BEST[key] = { key, name:c.name, rname:reg.name, rate:c.rate||0,
                      pyeong:c.pyeong, now:c.now||0, sibMed:c.sibMed||0,
                      sibs:c.sibs||[], regionCode:reg.code, hh:c.hh||0,
                      pp:c.pp||0, by:c.by||0 };   // [필터용] 평당가·건축년도 추가
      }
    }
  }

  map = L.map('map',{zoomControl:true}).setView([35.18,129.08],12);  // 부산 시작
  /* [스타일 v3] 배경 지도를 VWorld(국토부) 타일로.
     · 한국 학교·상가·역·등산로가 네이버 수준으로 표시됨 (Voyager는 서양용이라 텅 비었음)
     · 아래 VWORLD_KEY 에 발급받은 키를 넣어야 합니다 (collect_coords.py 와 같은 키) */
  const VWORLD_KEY = "";   // ← 여기에 VWorld 키 입력!
  if(VWORLD_KEY){
    L.tileLayer(`https://api.vworld.kr/req/wmts/1.0.0/${VWORLD_KEY}/Base/{z}/{y}/{x}.png`,
      {maxZoom:19, attribution:'© VWorld 국토교통부'}).addTo(map);
  }else{
    // 키 없으면 임시로 Voyager (한국 상세표시 없음)
    L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png',
      {maxZoom:19, subdomains:'abcd', attribution:'© OpenStreetMap © CARTO'}).addTo(map);
  }

  layerTags = L.layerGroup();      // 이름 말풍선 (확대 시)
  layerDots = L.markerClusterGroup({maxClusterRadius:45, chunkedLoading:true}); // 점 (축소 시)

  let placed=0;
  for(const key in BEST){
    const b=BEST[key], co=COORDS[key];
    if(!co) continue;
    b.lat=co.lat; b.lon=co.lon;
    const color=rateColor(b.rate);
    const label=(b.rate>=0?'+':'')+b.rate.toFixed(0)+'%';

    // (A) 아실식 말풍선: 이름 + 현재가·저평가율
    const tagIcon=L.divIcon({className:'',iconSize:[1,1],
      html:`<div class="tag" id="tag-${cssId(key)}">
              <div class="nm">${b.name}</div>
              <div class="pr" style="background:${color}">${fmtEok(b.now)} · ${label}</div>
            </div>`});
    const tag=L.marker([co.lat,co.lon],{icon:tagIcon});
    tag.on('click',()=>select(key));
    tag.bindPopup(()=>popupHtml(b),{maxWidth:280});

    // (B) 축소용 점
    const dotIcon=L.divIcon({className:'',iconSize:[1,1],
      html:`<div class="pin" style="background:${color}">${label}</div>`});
    const dot=L.marker([co.lat,co.lon],{icon:dotIcon});
    dot.on('click',()=>select(key));
    dot.bindPopup(()=>popupHtml(b),{maxWidth:280});

    MARKERS[key]={tag,dot};
    layerDots.addLayer(dot);
    placed++;
  }

  map.on('zoomend',syncLayers);
  syncLayers();

  document.getElementById('count').textContent=`저평가 후보 ${placed}곳`;
  document.getElementById('loading').style.display='none';
  setupMapSearch();       // [검색] 데이터 로딩 후 검색창 활성화
  setupFilters();         // [필터] 저평가율·평형·세대수
}

function setupFilters(){
  const g=id=>document.getElementById(id);
  const fr=g('fRate'), fp=g('fPy'), fh=g('fHh'), fb=g('fBy'), fn=g('fNow'), fpp=g('fPp');
  if(!fr) return;
  // 범위 문자열("10-20")을 [10,20] 배열로. 빈 값이면 null.
  const range=v=> v ? v.split('-').map(Number) : null;
  fr.onchange =()=>{ FILTER.rate=parseFloat(fr.value)||0; applyFilter(); };
  fh.onchange =()=>{ FILTER.hh=parseInt(fh.value)||0; applyFilter(); };
  fp.onchange =()=>{ FILTER.py=range(fp.value); applyFilter(); };
  fb.onchange =()=>{ FILTER.by=range(fb.value); applyFilter(); };
  fn.onchange =()=>{ FILTER.now=range(fn.value); applyFilter(); };
  fpp.onchange=()=>{ FILTER.pp=range(fpp.value); applyFilter(); };
}

/* ── [검색 · 2026-08] 아파트 이름 검색 → 그 위치로 지도 이동 ──
   BEST(후보 목록)에서 이름을 찾고, 고르면:
   지도 이동(줌16) + 핀 선택(패널·동급 하이라이트까지 자동) */
function setupMapSearch(){
  const inp=document.getElementById('mapSearch');
  const box=document.getElementById('mapSearchResults');
  if(!inp||!box) return;
  const hide=()=>box.style.display='none';

  inp.addEventListener('input',()=>{
    const q=inp.value.trim().replace(/\s/g,'').toLowerCase();
    if(!q){ hide(); return; }
    /* [2026-08 v3] index 검색과 동급으로 재작성:
       · 같은 단지의 평형들을 묶어 "평형 N개"로 표시 (예전엔 첫 평형 하나만 나옴)
       · 매치 후보면 ⭐+저평가율, 좌표 있으면 📍(지도 이동), 없으면 📊(차트만)
       · 검색어로 '시작'하는 이름 우선 정렬 */
    const DATA=window.__APTDATA__;
    const units=(DATA&&DATA.peerdata&&DATA.peerdata.units)||{};
    const grp={};                      // 'rc|이름' → 묶음
    for(const uk in units){
      const u=units[uk];
      if(!(u.name||'').replace(/\s/g,'').toLowerCase().includes(q)) continue;
      const id=u.rc+'|'+u.name;
      if(!grp[id]){
        const cand=BEST[id];           // 매치 후보?
        const co=COORDS_G[id];         // 좌표?
        grp[id]={name:u.name, rname:(cand?cand.rname:(u.rn||'')),
                 pys:new Set(), rate:cand?cand.rate:null,
                 key:cand?cand.key:null, rcode:u.rc,
                 hasCoord:!!(co||cand&&cand.lat), coordKey:id};
      }
      if(u.pyeong) grp[id].pys.add(u.pyeong);
    }
    const starts=x=>x.name.replace(/\s/g,'').toLowerCase().startsWith(q)?0:1;
    const hits=Object.values(grp)
      .sort((a,b)=> starts(a)-starts(b)
                 || ((b.rate!=null)-(a.rate!=null))
                 || a.name.length-b.name.length)
      .slice(0,15);
    if(!hits.length){
      box.innerHTML='<div class="empty">검색 결과 없음</div>';
      box.style.display='block'; return;
    }
    box.innerHTML=hits.map(h=>{
      const star = h.rate!=null ? ` · ⭐매치 ${(h.rate>=0?'+':'')+h.rate.toFixed(0)}%` : '';
      const mark = h.hasCoord ? '📍' : '📊';
      return `<div class="sr">${mark} <b>${h.name}</b><span>${h.rname} · 평형 ${h.pys.size}개${star}</span></div>`;
    }).join('');
    box.querySelectorAll('.sr').forEach((el,i)=>{
      el.onclick=()=>{
        const h=hits[i];
        inp.value=h.name; hide();
        if(h.hasCoord){
          const co = h.key ? BEST[h.key] : COORDS_G[h.coordKey];
          map.setView([co.lat,co.lon],16);
          if(h.key) setTimeout(()=>{ refreshTags(); select(h.key); },300);
          else openPanel(h.rcode, h.name);   // 좌표 있으나 후보 아님 → 이동+패널
        }else{
          openPanel(h.rcode, h.name);        // 좌표 없음 → 차트 패널만
        }
      };
    });
    box.style.display='block';
  });
  document.addEventListener('click',e=>{ if(!e.target.closest('.search')) hide(); });
  // 엔터 치면 첫 결과로
  inp.addEventListener('keydown',e=>{
    if(e.key==='Enter'){
      const first=box.querySelector('.sr');
      if(first) first.click();
    }
  });
}

function cssId(key){ return key.replace(/[^a-zA-Z0-9가-힣]/g,'_'); }

/* 확대 정도에 따라 말풍선 ↔ 점 전환 */
function syncLayers(){
  const z=map.getZoom();
  if(z>=ZOOM_TAG){
    if(map.hasLayer(layerDots)) map.removeLayer(layerDots);
    if(!map.hasLayer(layerTags)){
      layerTags.clearLayers();
      // 화면 안 것만 올려 성능 유지
      const bd=map.getBounds();
      for(const key in MARKERS){
        const b=BEST[key];
        if(b.lat && passFilter(b) && bd.contains([b.lat,b.lon])) layerTags.addLayer(MARKERS[key].tag);
      }
      map.addLayer(layerTags);
    }
  }else{
    if(map.hasLayer(layerTags)) map.removeLayer(layerTags);
    if(!map.hasLayer(layerDots)) map.addLayer(layerDots);
  }
}
/* 이동 시 화면 안 말풍선 갱신 */
function refreshTags(){
  if(map.getZoom()<ZOOM_TAG) return;
  layerTags.clearLayers();
  const bd=map.getBounds();
  for(const key in MARKERS){
    const b=BEST[key];
    if(b.lat && passFilter(b) && bd.contains([b.lat,b.lon])) layerTags.addLayer(MARKERS[key].tag);
  }
}

/* 팝업 내용: 현재가·동급중앙값·저평가율·동급 목록 */
function popupHtml(b){
  const color=rateColor(b.rate);
  const label=(b.rate>=0?'+':'')+b.rate.toFixed(1)+'%';
  const sibItems=(b.sibs||[]).slice(0,6).map(s=>{
    const nm=String(s).split('|')[0];
    return `<div class="p" onclick="jumpToName('${b.regionCode}','${nm.replace(/'/g,"\\'")}')">· ${nm}</div>`;
  }).join('');
  return `<div class="pop">
    <h4>${b.name}</h4>
    <div class="sub">${b.rname} · ${b.pyeong}평${b.hh?` · ${b.hh.toLocaleString()}세대`:''}</div>
    <div class="nums">
      <div class="n"><div class="t">현재가</div><div class="v">${fmtEok(b.now)}</div></div>
      <div class="n"><div class="t">동급 중앙값</div><div class="v">${fmtEok(b.sibMed)}</div></div>
    </div>
    <div class="rate" style="color:${color}">${label} 저평가</div>
    ${sibItems?`<div class="peers"><div class="pt">동급 아파트 (누르면 이동)</div>${sibItems}</div>`:''}
    <a class="go" href="javascript:void(0)" onclick="openPanel('${b.regionCode}','${b.name.replace(/'/g,"\\'")}')">📊 차트·거래이력 보기 (구/시/전국)</a>
    <div class="hint">새 탭에서 열려요 · 지도는 그대로</div>
  </div>`;
}

/* 클릭 선택: 범위 원 + 동급 하이라이트 */
function select(key){
  const b=BEST[key]; if(!b||!b.lat) return;
  // 이전 선택 지우기
  clearSelect();
  selKey=key;
  // [B안] 핀 클릭 = 사이드 패널도 바로 열기 (아실처럼 원클릭)
  openPanel(b.regionCode, b.name);

  // ① 그 단지 주변 범위 원 (반경: 세대수에 비례, 100~250m)
  const r=Math.min(250, Math.max(100, Math.sqrt(b.hh||300)*8));
  selCircle=L.circle([b.lat,b.lon],{radius:r,color:'#7048E8',weight:2,
    fillColor:'#7048E8',fillOpacity:0.10}).addTo(map);

  // ② 같은 화면의 동급 단지 말풍선을 보라색으로
  const sibNames=new Set((b.sibs||[]).map(s=>String(s).split('|')[0]));
  for(const k in BEST){
    const o=BEST[k];
    if(k!==key && o.regionCode && sibNames.has(o.name)){
      const el=document.getElementById('tag-'+cssId(k));
      if(el) el.classList.add('sib-hl');
    }
  }
  const meEl=document.getElementById('tag-'+cssId(key));
  if(meEl) meEl.classList.add('sel');
}
/* ── [B안] 사이드 패널 제어 ─────────────────────
   openPanel: iframe 주소를 그 단지 해시로 바꾸고 패널을 엶.
   같은 단지를 또 열면 iframe 재로딩 없이 패널만 보여줌(빠름). */
let panelKey=null;
function openPanel(rcode, name){
  const url = './chart.html#u=' + encodeURIComponent(rcode + '|' + name);
  const fr = document.getElementById('panelFrame');
  const key = rcode + '|' + name;
  if(panelKey !== key){
    fr.src = url;                    // 해시가 바뀌면 index 의 hashchange 가 그 단지를 엶
    panelKey = key;
  }
  document.getElementById('panelTitle').textContent = name;
  document.body.classList.add('panel-open');
  setTimeout(()=>map.invalidateSize(), 280);   // 지도 크기 재계산 (패널로 밀린 뒤)
}
function closePanel(){
  document.body.classList.remove('panel-open');
  setTimeout(()=>map.invalidateSize(), 280);
}
function openPanelTab(){             // 새 탭에서 크게 보기
  if(panelKey) window.open('./chart.html#u=' + encodeURIComponent(panelKey), '_blank');
}
/* [리사이즈 · 2026-08] 패널 오른쪽 모서리를 끌면 폭이 넓어짐 (320~80%까지).
   차트를 크게 보고 싶을 때 답답함 해소용. iframe 위 드래그가 끊기지 않게
   드래그 중엔 iframe 마우스를 잠시 꺼 둡니다. */
(function(){
  const handle=document.getElementById('panelResize');
  const fr=document.getElementById('panelFrame');
  if(!handle) return;
  let dragging=false;
  handle.addEventListener('mousedown',e=>{
    dragging=true; document.body.classList.add('resizing');
    fr.style.pointerEvents='none'; e.preventDefault();
  });
  document.addEventListener('mousemove',e=>{
    if(!dragging) return;
    const w=Math.min(window.innerWidth*0.8, Math.max(320, e.clientX));
    document.documentElement.style.setProperty('--panelW', w+'px');
    map.invalidateSize();
  });
  document.addEventListener('mouseup',()=>{
    if(!dragging) return;
    dragging=false; document.body.classList.remove('resizing');
    fr.style.pointerEvents='';
    map.invalidateSize();
  });
})();

function clearSelect(){
  if(selCircle){ map.removeLayer(selCircle); selCircle=null; }
  document.querySelectorAll('.tag.sel,.tag.sib-hl')
    .forEach(el=>el.classList.remove('sel','sib-hl'));
  selKey=null;
}

/* 동급 이름 클릭 → 그 단지로 지도 이동 */
function jumpToName(rcode,name){
  // 같은 지역 우선, 없으면 전체에서 이름으로
  let target=BEST[rcode+'|'+name];
  if(!target){
    for(const k in BEST){ if(BEST[k].name===name){ target=BEST[k]; break; } }
  }
  if(target&&target.lat){
    map.setView([target.lat,target.lon],16);
    setTimeout(()=>{ select(target.key); refreshTags(); },300);
  }
}

function fail(msg){
  document.getElementById('loading').innerHTML=
    `<div style="color:#E5484D;font-size:14px">⚠️ ${msg}</div>
     <div style="font-size:12px">py -m http.server 8000 → http://localhost:8000/map.html</div>`;
}

boot();
// 지도 이동 멈추면 화면 안 말풍선 갱신
document.addEventListener('DOMContentLoaded',()=>{ 
  const t=setInterval(()=>{ if(map){ map.on('moveend',refreshTags); clearInterval(t);} },200);
});
</script>
